aid: tvu-networks
name: TVU Networks
description: TVU Networks is a live video transmission and cloud production company founded in 2005 and headquartered
  in Mountain View, California. Its IP-based ecosystem covers acquisition (TVU One and TVU Anywhere bonded-cellular
  transmitters), cloud routing and distribution (TVU MediaHub), cloud production (TVU Producer, TVU Partyline, TVU
  Remote Commentator), FAST and linear playout (TVU Channel), and AI-assisted media management and search (TVU MediaMind,
  TVU Search). TVU publishes a public HTTP API across those products — 352 operations spanning MediaHub routing,
  Search and metadata, Producer control, Grid device transmission, Partyline, Channel playout, SCTE-35 ad insertion
  and a MOS newsroom gateway — documented on its own Apifox-hosted API documentation site, with Bearer AppSecret,
  SID session and AccessKey-signature authentication.
