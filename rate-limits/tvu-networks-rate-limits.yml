note: >-
  TVU publishes no rate limits. None of the 352 exported operations declares a 429 response, and
  no RateLimit-*, X-RateLimit-* or Retry-After header appears in any response definition or in
  any documentation page. The only quota signal TVU publishes at all is indirect: four
  application error codes on the export surface report that a limit was hit
  (1031 "video export time exceeds os limit", 1032 "video export time exceeds single-user
  limit", 1046 "insufficient remaining free space", 1052 "export video duration operation
  maximum duration") without ever stating what the limit is. An agent therefore cannot budget
  against this API — it can only discover a ceiling by crossing it, and it will read the crossing
  as an HTTP 200.
