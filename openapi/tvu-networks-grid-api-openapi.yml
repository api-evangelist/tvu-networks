                - actionType
                - title
                - description
                - startTime
                - endTime
                - peerName
                - peerFullId
                - type
                - delay
                - bitrate
                - fullId
                - outputFilterId
                - switchType
                - eventId
                - tname
                - tpeerid
                - rpeerid
                - ttype
            example:
            - actionType: add
              title: new Event
              description: 9d3c
              startTime: '1599732634000'
              endTime: '1599819034000'
              peerName: webteam_a7fe
              peerFullId: c60d05ab8d93a7fe
              type: t
              delay: '5'
              bitrate: '300'
              fullId: 1998ffef1f409d3c
              outputFilterId: ''
              switchType: ''
            - actionType: delete
              eventId: '4512'
            - actionType: edit
              eventId: '4519'
              description: 33sssssssssss
              startTime: '1600516262000'
              endTime: '1600692662000'
              tname: webteam_a7fe
              tpeerid: c60d05ab8d93a7fe
              rpeerid: 1998ffef1f409d3c
              ttype: t
              delay: '5'
              bitrate: '300'
              title: '300'
            - actionType: query
              eventId: '4511'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apifox-orders: []
          headers: {}
          x-apifox-name: Success
