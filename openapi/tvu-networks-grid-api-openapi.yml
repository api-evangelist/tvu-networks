                    type: string
                    description: Event start time
                  endTime:
                    type: string
                    description: Event end time
                  peerName:
                    type: string
                    description: Source name
                  peerFullId:
                    type: string
                    description: ource id
                  type:
                    type: string
                    description: Source type
                  delay:
                    type: string
                    description: Event delay
                  bitrate:
                    type: string
                    description: Event bitrate
                  fullId:
                    type: string
                    description: Receiver id
                  outputFilterId:
                    type: string
                    description: Output filter id
                  switchType:
                    type: string
                    description: Switch type
                  eventId:
                    type: string
                    description: Event id
                  tname:
                    type: string
                  tpeerid:
                    type: string
                  rpeerid:
                    type: string
                  ttype:
                    type: string
