                        type: integer
                      navigatepageNums:
                        type: array
                        items:
                          type: string
                      navigateFirstPage:
                        type: integer
                      navigateLastPage:
                        type: integer
                      firstPage:
                        type: integer
                      lastPage:
                        type: integer
                    required:
                    - total
                    - list
                    - pageNum
                    - pageSize
                    - size
                    - startRow
                    - endRow
                    - pages
                    - prePage
                    - nextPage
                    - isFirstPage
                    - isLastPage
                    - hasPreviousPage
                    - hasNextPage
                    - navigatePages
                    - navigatepageNums
