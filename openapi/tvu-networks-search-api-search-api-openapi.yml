  /api/search/v2/appearance/list:
    get:
      summary: Get appearance list
      deprecated: false
      description: Get appearance detection results by sourceObjectId. Supports cursor-based pagination via pageSize and afterContent.
      tags:
      - Search API/search
      parameters:
      - name: sourceObjectId
        in: query
        description: Source Object ID
        required: true
        schema:
          type: string
      - name: startTimestamp
        in: query
        description: Start of query range (Unix ms). Defaults to endTimestamp - 1 day
        required: false
        schema:
          type: integer
      - name: endTimestamp
        in: query
        description: End of query range (Unix ms). Defaults to current time
        required: false
        schema:
          type: integer
      - name: appearanceType
        in: query
        description: 'Filter by appearance class type: 0=logo/brand, 1=text/number, 2=person/face. Defaults to 0 (no filter applied)'
        required: false
        schema:
          type: integer
      - name: pageSize
        in: query
        description: Number of content groups per page; 0 or omitted returns all
        required: false
        schema:
          type: integer
      - name: afterContent
        in: query
        description: Pagination cursor from previous response's afterContent field; omit for first page
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Retrieve Authentication Information Using the Authentication API with Session and Bearer Token Support
        required: true
        example: ''
        schema:
          type: string
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
