                properties:
                  errorCode:
                    type: integer
                    description: Error Code.
                  result:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            SourceId:
                              type: string
                              description: Source Id.
                            SourceType:
                              type: string
                              description: Source Type.
                            caption:
                              type: string
                              description: Matched caption data.
                            captionWithHighlight:
                              type: string
                              description: Highlighted matched caption data.
                            eventObjectID:
                              type: string
                              description: event object Id.
                            eventTitle:
                              type: string
                              description: event title.
                            eventTitleWithHighlight:
                              type: string
                              description: Highlighted matched Event Title.
                            language:
                              type: string
