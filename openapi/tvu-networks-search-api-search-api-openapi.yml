                                    type: string
                                    description: Source id.
                                  sourceObjectId:
                                    type: string
                                    description: Source Object Id.
                                  thumbnailFullPath:
                                    type: string
                                    description: Complete thumbnail path in the AWS S3 bucket.
                                  rid:
                                    type: string
                                    description: The peerId of R who record the mediafile.
