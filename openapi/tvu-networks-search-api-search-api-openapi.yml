  /api/search/v2/caption:
    get:
      summary: Get caption by source object
      deprecated: false
      description: 'Generate and download caption file (SRT/VTT/TXT/DOCX) for a given source object and time range. The response body is raw caption text (not JSON). On error, returns a JSON object with errorCode and errorInfo fields.

        Example SRT response:

        ```

        1

        00:00:00,031 --> 00:00:00,631

        his behalf.


        2

        00:00:00,631 --> 00:00:03,731

        So so far 25 members of Congress have

        ```'
      tags:
      - Search API/search
      parameters:
      - name: objectId
        in: query
        description: Source object ID
        required: true
        example: '1243229066681782272'
        schema:
          type: string
      - name: startTimestamp
        in: query
        description: Start time in milliseconds
        required: true
        example: 1717661814837
        schema:
          type: integer
      - name: endTimestamp
        in: query
        description: End time in milliseconds
        required: true
        example: 1717661879837
        schema:
          type: integer
      - name: format
        in: query
        description: 'Caption format: srt, vtt, txt, docx. Default: srt'
        required: false
        example: srt
        schema:
          type: string
          enum:
          - srt
          - vtt
          - txt
          - docx
      - name: languageType
        in: query
        description: Language type, default en-US
        required: false
        example: en-us
        schema:
          type: string
      - name: noTimeCode
        in: query
