openapi: 3.2.0
info:
  title: TVU Networks — Search Search API/event API
  description: Search API operations of the TVU Networks public HTTP API, assembled verbatim from the per-endpoint OpenAPI 3.0.1 exports TVU publishes on its own Apifox documentation site (https://docs.tvunetworks.cn/). Each operation body is the provider's own export; only grouping, servers[] and operationId backfill were added by API Evangelist.
  version: 1.0.0
  contact:
    name: TVU Networks
    url: https://www.tvunetworks.com/tvu-developer/
servers:
- url: https://api.tvunetworks.com
  description: Prod Env default server
- url: https://search.tvunetworks.com
  description: Apifox server "TVUSearch"
tags:
- name: Search API/event
paths:
  /search/v2/media/addClipToPP:
    post:
      summary: add the mark file to PP
      deprecated: false
      description: Place the clip object into the playback list of Produce.
      tags:
      - Search API/event
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                programId:
                  type: string
                  description: program id
                slotNo:
                  type: string
                objectId:
                  type: string
                  description: clip object id
              required:
              - programId
              - slotNo
              - objectId
              x-apifox-orders:
              - programId
              - slotNo
              - objectId
            example:
              programId: '104360961019904'
              slotNo: s12
              objectId: '1412669866040758272'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                  errorInfo:
                    type: string
                  result:
                    type: 'null'
                required:
                - errorCode
                - errorInfo
                - result
                x-apifox-orders:
                - errorCode
                - errorInfo
                - result
              example:
                errorCode: '0x0'
                errorInfo: OK
                result: null
          headers: {}
          x-apifox-name: OK
      security:
      - bearer: []
        x-apifox:
          schemeGroups:
          - id: h2jeawDuHj_2ZodQrUxah
            schemeIds:
            - bearer
          required: true
          use:
            id: h2jeawDuHj_2ZodQrUxah
          scopes:
            h2jeawDuHj_2ZodQrUxah:
              bearer: []
      x-apifox-folder: Search API/event
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-351711925-run
      operationId: add_the_mark_file_to_PP_351711925
      x-source-doc: https://docs.tvunetworks.cn/api-351711925.md
  /search/v2/media/currentSlugInfo:
    get:
      summary: current slug
      deprecated: false
      description: Get the slug corresponding to the current time of the sourceObject.
      tags:
      - Search API/event
      parameters:
      - name: objectId
        in: query
        description: source object id
        required: true
        example: '1031567688444559360'
        schema:
          type: string
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
