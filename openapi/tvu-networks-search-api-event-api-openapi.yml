      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                  errorInfo:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                      peerId:
                        type: string
                      objectId:
                        type: string
                      slug:
                        type: string
                      createTime:
                        type: integer
                      endTime:
                        type: integer
                      repeatId:
                        type: string
                      eventSlug:
                        type: string
                      title:
                        type: 'null'
                      report:
                        type: 'null'
                      deleteFlag:
                        type: 'null'
                      color:
                        type: integer
                    required:
                    - id
                    - peerId
                    - objectId
                    - slug
                    - createTime
                    - endTime
                    - repeatId
                    - eventSlug
                    - title
                    - report
                    - deleteFlag
                    - color
