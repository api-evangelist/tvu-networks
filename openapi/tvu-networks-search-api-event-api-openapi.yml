                - errorCode
                - errorInfo
                - result
              example:
                errorCode: '0x0'
                errorInfo: success
                result:
                  id: af95f2b9205f43458a074afc63a84846
                  peerId: 4b999dc458fbc4c80000000000000002
                  objectId: '1031567688444559360'
                  slug: 'Atlanta, Georgia bump shot Source: CNN Market Embargo: NONE '
                  createTime: 1673315661594
                  endTime: 9999999999999
                  repeatId: ''
                  eventSlug: 'Atlanta, Georgia bump shot Source: CNN Market Embargo: NONE '
                  title: null
                  report: null
                  deleteFlag: null
                  color: 0
          headers: {}
