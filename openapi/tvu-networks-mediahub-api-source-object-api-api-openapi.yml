components:
  schemas:
    ObjectInfoDTO:
      type: object
      properties:
        objectId:
          type: string
        objectName:
          type: string
        tangibleId:
          type: string
        tangibleInfo:
          type: string
        objectType:
          type: integer
          format: int32
        url:
          type: string
      x-apifox-orders:
      - objectId
      - objectName
      - tangibleId
      - tangibleInfo
      - objectType
      - url
      x--orders:
      - objectId
      - objectName
      - tangibleId
      - tangibleInfo
      - objectType
      - url
      x--ignore-properties: []
      x-apifox-folder: ''
    ResponseResult:
      type: object
      properties:
        errorCode:
          type: string
          examples:
          - '0x0'
        errorInfo:
          type: string
          examples:
          - success
        result:
          type: object
          x-apifox-orders: []
          properties: {}
          x-apifox-ignore-properties: []
        async:
          type: boolean
        errorBody:
          type: object
          x-apifox-orders: []
          properties: {}
          x-apifox-ignore-properties: []
      x-apifox-orders:
      - errorCode
      - errorInfo
      - result
      - async
      - errorBody
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    ResponseResultObjectInfoDTO:
      type: object
      properties:
        errorCode:
          type: string
          examples:
          - '0x0'
        errorInfo:
          type: string
          examples:
          - success
        async:
          type: boolean
        result:
          $ref: '#/components/schemas/ObjectInfoDTO'
      x-apifox-orders:
      - errorCode
      - errorInfo
      - async
      - result
      x--orders:
      - errorCode
      - errorInfo
      - async
      - result
      x--ignore-properties: []
      x-apifox-folder: ''
    ResponseResultSourceSearchPageVo:
