            $ref: '#/components/schemas/SourceSearchObject'
      x-apifox-orders:
      - totalNum
      - sourceList
      x--orders:
      - totalNum
      - sourceList
      x--ignore-properties: []
      x-apifox-folder: ''
    ObjectConnectInfo:
      type: object
      properties:
        status:
          type: string
          description: source object status
          enum:
          - inactive
          - active
          examples:
          - active
        live:
          type: boolean
          description: whether the source is LIVE
        projectId:
          type: string
          description: when source object is live this value will be returned
      description: source object connect info
      x-apifox-orders:
