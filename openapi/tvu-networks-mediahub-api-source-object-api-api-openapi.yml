      - sourceType
      type: object
      properties:
        sourceName:
          type: string
        url:
          type: string
        sourceType:
          type: string
        region:
          type: string
          default: us-east-1
          examples:
          - us-east-1
        boxPoolId:
          type: string
          description: This property can be obtained from tvu home by contacting support
      x-apifox-orders:
      - sourceName
      - url
      - sourceType
      - region
      - boxPoolId
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
