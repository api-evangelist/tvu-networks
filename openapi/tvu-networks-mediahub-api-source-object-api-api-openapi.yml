      x--orders:
      - errorCode
      - errorInfo
      - async
      - result
      x--ignore-properties: []
      x-apifox-folder: ''
    UpdateSourceObjectDTO:
      required:
      - objectId
      - sourceName
      - url
      type: object
      properties:
        objectId:
          type: string
        sourceName:
          type: string
        url:
          type: string
        region:
          type: string
          description: When setting the boxPoolId property, the region property is ignored.
          default: us-east-1
          examples:
          - us-east-1
        boxPoolId:
          type: string
          description: This property can be obtained from tvu home by contacting support
      x-apifox-orders:
      - objectId
      - sourceName
      - url
      - region
      - boxPoolId
      x--orders:
      - objectId
      - sourceName
      - url
      - region
      - boxPoolId
      x--ignore-properties: []
      x-apifox-folder: ''
    Attribute:
      type: object
      properties:
        attrName:
          type: string
        attrValue:
          type: array
          items:
            type: string
      x-apifox-orders:
      - attrName
      - attrValue
      x--orders:
      - attrName
      - attrValue
      x--ignore-properties: []
      x-apifox-folder: ''
    SourceSearchTag:
