openapi: 3.2.0
info:
  title: TVU Networks — Channel Channel API/Event API
  description: Channel API operations of the TVU Networks public HTTP API, assembled verbatim from the per-endpoint OpenAPI 3.0.1 exports TVU publishes on its own Apifox documentation site (https://docs.tvunetworks.cn/). Each operation body is the provider's own export; only grouping, servers[] and operationId backfill were added by API Evangelist.
  version: 1.0.0
  contact:
    name: TVU Networks
    url: https://www.tvunetworks.com/tvu-developer/
servers:
- url: https://api.tvunetworks.com
  description: Prod Env default server
tags:
- name: Channel API/Event
paths:
  /device/getSourceIdByTypeAndName:
    post:
      summary: Get sourceId based on sourceType and sourceName
      deprecated: false
      description: ''
      tags:
      - Channel API/Event
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - Media
                  - File
                  - Ext
                  x-apifox-enum:
                  - value: Media
                    name: Media
                    description: Media In Drive
                  - value: File
                    name: File
                    description: Json File In Drive
                  - value: Ext
                    name: Ext
                    description: LiveSource In CC
                  examples:
                  - Media
                  description: Source Type; Media/File/Ext
                name:
                  type: string
                  description: SourceName
                  minLength: 1
                  maxLength: 255
                  examples:
                  - 01.mp4
              required:
              - type
              - name
              x-apifox-orders:
              - type
              - name
            example:
              type: Media
              name: 01.mp4
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                  errorInfo:
                    type: string
                  result:
                    type: string
                    description: SourceId
                required:
                - errorCode
                - errorInfo
                - result
                x-apifox-orders:
                - errorCode
                - errorInfo
                - result
              example:
                errorCode: '0x0'
                errorInfo: Success
                result: 55524c204558544c000011917efddbdf
          headers: {}
          x-apifox-name: Success
      security: []
      x-apifox-folder: Channel API/Event
      x-apifox-status: developing
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-250778584-run
      operationId: Get_sourceId_based_on_sourceType_and_sourceName_250778584
      x-source-doc: https://docs.tvunetworks.cn/api-250778584.md
  /event/batchAdd:
    post:
      summary: batch add event
      deprecated: false
      description: ''
      tags:
      - Channel API/Event
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
