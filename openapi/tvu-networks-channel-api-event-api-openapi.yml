          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                programId:
                  type: string
                  description: Can not be empty. The primary key ID of the program, which is the last 32-bit string on the URL after entering the Program
                  examples:
                  - bf126e495c0d47308fda297cf96b59b1
                  maxLength: 32
                eventParams:
                  type: array
                  items:
                    type: object
                    properties:
                      color:
                        type: string
                        description: This is the color displayed on the default UI
                        default: rgb(255, 192, 0)
                      duration:
                        type: number
                      endTime:
                        type: number
                      name:
                        type: string
                        default: fileName
                      offset:
                        type: integer
                        default: 0
                        description: default is 0
                      scheduleType:
                        type: string
                        default: live
                        description: default is 'live'
                      sourceType:
                        type: integer
                        description: 0=media 1=live
                      startTime:
                        type: number
                      title:
                        type: string
                        maxLength: 220
                      tpeerid:
                        type: string
                        description: the selected playback file sourceId
                      ttype:
                        type: string
                        description: ' default is ‘File’'
                      turl:
                        type: string
                      eventSegments:
                        type: array
                        items:
                          type: object
                          properties:
                            segmentId:
                              type: integer
                            segmentOrder:
                              type: integer
                            timingIn:
                              type: number
                            timingOut:
                              type: number
                            sourceId:
                              type: string
                              description: if segmentId=2 can not empty
                            fileType:
                              type: string
                              description: if segmentId=2 default=Video
                            fileName:
                              type: string
                              description: file name
                            eventOperationType:
                              type: string
                              description: if segmentId=2 use 'Underplay clip'
                          x-apifox-orders:
                          - segmentId
                          - segmentOrder
                          - timingIn
                          - timingOut
                          - sourceId
                          - fileType
                          - fileName
                          - eventOperationType
                          required:
                          - segmentId
                          - segmentOrder
                          - timingIn
                          - timingOut
                    x-apifox-orders:
                    - color
                    - duration
                    - endTime
                    - name
                    - offset
                    - scheduleType
                    - sourceType
                    - startTime
                    - title
                    - tpeerid
                    - ttype
                    - turl
                    - eventSegments
                    required:
                    - endTime
                    - startTime
                    - title
                    - tpeerid
                    - ttype
                    - turl
                    - eventSegments
                    - duration
                    - name
                    - sourceType
              x-apifox-orders:
              - programId
              - eventParams
              required:
              - eventParams
              - programId
            example:
              eventParams:
              - color: rgb(255, 192, 0)
                scheduleType: live
                sourceType: 0
                title: youtube-3_Replay_20240924_154023_1104217.json
                name: youtube-3_Replay_20240924_154023_1104217.json
                tpeerid: 55524c204558544c00001192279c96f7
