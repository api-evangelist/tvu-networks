  /search/v2/media/createSlugRecord:
    post:
      summary: Create a new slug and trigger recording.
      deprecated: false
      description: "Creates a new slug bound to the specified source object and immediately applies\n\
        the recording configuration determined by recordingType. The authenticated user's\nID is resolved\
