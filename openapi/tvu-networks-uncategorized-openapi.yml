        Request example (RRS, POST v2/media/updateSlugRecord):\n{\n  \"slugId\": \"slug-xyz789\",\n  \"\
        title\": \"Evening News Updated\",\n  \"endTime\": 1713007200000,\n  \"recordingType\": 1,\n \
        \ \"rrsRecordingParameters\":{\n    \"templateId\": \"default\",\n    \"recording\": 1,\n    \"\
        transcriber\": 1,\n    \"vision\": 0,\n    \"transcriberParameter\": \"{\\\"aiproxy\\\":{\\\"\
        strLanguage\\\":\\\"en-US\\\"}}\",\n    \"rrsCustomParameter\": \"{\\\"storage_info.bucket_name\\\
        \":\\\"mma-video-new\\\"}\"\n  }\n}\n\nRequest example (MMA, POST v2/media/updateSlugRecord):\n\
