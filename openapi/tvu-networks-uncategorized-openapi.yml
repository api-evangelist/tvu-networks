        \ 1=Enable.\n\nRequest example (MMA, POST v2/media/createSlugRecord):\n{\n  \"sourceObjectId\"\
        : \"obj-abc123\",\n  \"slug\": \"evening-news\",\n  \"title\": \"Evening News\",\n  \"report\"\
        : \"Daily report\",\n  \"startTime\": 1713000000000,\n  \"endTime\": 1713003600000,\n  \"recordingType\"\
        : 0,\n  \"mmaRecordingParameters\":{\n    \"livePreview\": 1,\n    \"gridDistribution\": 0,\n\
        \    \"recording\": 1,\n    \"speechTranscription\": 1,\n    \"faceDetection\": 0,\n    \"transcriberInfo\"\
        : \"{\\\"LanguageCode\\\":\\\"en-US\\\"}\",\n    \"sourceResolution\": 0\n  }\n}\n\nRequest example\
        \ (RRS, POST v2/media/createSlugRecord):\n{\n  \"sourceObjectId\": \"obj-abc123\",\n  \"title\"\
        : \"Evening News\",\n  \"startTime\": 1713000000000,\n  \"recordingType\": 1,\n  \"rrsRecordingParameters\"\
        :{\n    \"templateId\": \"default\",\n    \"recording\": 1,\n    \"transcriber\": 1,\n    \"vision\"\
