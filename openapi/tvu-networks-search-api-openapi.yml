  /api/resource/v2/thumbnail:
    get:
      summary: thumbnail
      deprecated: false
      description: get thumbnail api
      tags:
      - Search API/extract
      - public
      parameters:
      - name: LivePath
        in: query
        description: hls http link
        required: false
        example: https://pp-va-001.s3.amazonaws.com/MH/RECORDINGS/1253344220354326528/e733264437ce4575954abc7841fd0e85/1/play.m3u8
        schema:
          type: string
      - name: VodUrl
        in: query
        description: vod url (mutually exclusive with the above LivePath)
        required: false
        schema:
          type: string
      - name: Offset
        in: query
        description: ms
        required: true
        schema:
          type: integer
      - name: tagvalue
        in: header
        description: ''
        required: false
        example: '{{tagvalue}}'
        schema:
          type: string
          default: '{{tagvalue}}'
      - name: SID
        in: header
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  ErrorCode:
                    type: number
                    description: error code
                    default: 1000
                  ErrorMessage:
                    type: string
                    description: error message
                    default: success
                  ImagePath:
