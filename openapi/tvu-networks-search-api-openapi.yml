      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceId:
                  type: string
                  description: One objectId or sourceId is mandatory
                startTime:
                  type: integer
                  description: Slug Start time. Current time by default
                title:
                  type: string
                  description: 'Slug content: title-report-slug'
                report:
                  type: string
                  description: 'Slug content: title-report-slug'
                slug:
                  type: string
                  description: 'Slug content: title-report-slug'
                endTime:
                  type: integer
                  description: End time of slug. The default value is 9999999999999
                objectId:
                  type: string
                  description: One objectId or sourceId is mandatory
                slugAdvanced:
                  type: object
                  properties:
                    livePreview:
                      type: integer
                      description: 0:Close 1.Enable
                    gridDistribution:
                      type: integer
                      description: 0:Close 1.Enable
                    recording:
                      type: integer
                      description: 0:Close 1.Enable
                    speechTranscription:
                      type: integer
                      description: 0:Close 1.Enable
                    faceDetection:
                      type: integer
                      description: 0:Close 1.Enable
                    transcriberInfo:
                      type: string
                      description: Json string，eg:{"LanguageCode":"en-US"}
                    sourceResolution:
                      type: integer
                      description: //0:1080p60  1:lower  2:4kp30
                  description: Used to start MMA recording
                  x-apifox-orders:
                  - livePreview
                  - gridDistribution
                  - recording
                  - speechTranscription
                  - faceDetection
                  - transcriberInfo
                  - sourceResolution
                slugRecord:
                  type: object
                  properties:
                    templateId:
                      type: string
                      description: The template used to start the corresponding module
                    recording:
                      type: string
                      description: 0:Enable  1:Close. The default setting is enabled.
                    vision:
                      type: string
                      description: 0:Enable  1:Close
