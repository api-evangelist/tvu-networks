  /search/v2/media/updateSlugRecord:
    post:
      summary: Update an existing slug and its recording configuration
      deprecated: false
      description: 'Updates the metadata and recording parameters of an existing slug identified by slugId.

        Only the fields that are explicitly provided will be updated; omitted fields retain their

        current values. The authenticated user''s ID is resolved automatically from the request context.


        Only one recording backend is applied, strictly determined by recordingType:

        recordingType=1 uses mmaRecordingParameters, recordingType=2 uses rrsRecordingParameters.

        All switch fields (recording, livePreview, transcriber, etc.) use a unified convention:

        0=Close, 1=Enable.


        Request example (RRS, POST v2/media/updateSlugRecord):

        {

        "slugId": "slug-xyz789",

        "title": "Evening News Updated",

        "endTime": 1713007200000,

        "recordingType": 1,

        "rrsRecordingParameters":{

        "templateId": "default",

        "recording": 1,

        "transcriber": 1,

        "vision": 0,

        "transcriberParameter": "{\"aiproxy\":{\"strLanguage\":\"en-US\"}}",

        "rrsCustomParameter": "{\"storage_info.bucket_name\":\"mma-video-new\"}"

        }

        }


        Request example (MMA, POST v2/media/updateSlugRecord):

        {

        "slugId": "slug-xyz789",

        "recordingType": 0,

        "mmaRecordingParameters":{

        "recording": 1,

        "livePreview": 1,

        "sourceResolution": 0

        }

        }


        Response example (success):

        {

        "errorCode": "0x0",

        "errorInfo": "success",

        "result": null

        }


        Response example (parameter error):

        {

        "errorCode": "80B00101",

        "errorInfo": "Parameter error",

        "result": null

        }'
      tags:
      - Search
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSlugRecordParam'
              description: "Request body. slugId and recordingType are required.\n              When recordingType=0, mmaRecordingParameters is required.\n              When recordingType=1, rrsRecordingParameters is required."
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResultObject'
                description: ProcessResult with errorCode "0x0" on success, or an error code on failure.
          headers: {}
          x-apifox-name: ''
      security:
      - bearer: []
        x-apifox:
          schemeGroups:
          - id: pIfH_P7SGkQDZQwQtwQhH
            schemeIds:
            - bearer
          required: true
          use:
            id: pIfH_P7SGkQDZQwQtwQhH
          scopes:
            pIfH_P7SGkQDZQwQtwQhH:
              bearer: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-450372673-run
      operationId: Update_an_existing_slug_and_its_recording_configuration_450372673
      x-source-doc: https://docs.tvunetworks.cn/api-450372673.md
components:
  schemas:
    ProcessResultObject:
      type: object
      properties:
        errorCode:
          type: string
          description: 'Error code. "0x0" indicates success; any other value indicates an error.

            Common codes: "0x0"=success, "80B00101"=parameter error, "0x80100002"=null record,

            "0x80100003"=exception, "0x80100008"=request timeout.'
        errorInfo:
          type: string
          description: 'Human-readable error message corresponding to errorCode.

            "success" when errorCode is "0x0".'
        result:
          type: object
          properties: {}
          x--orders: []
          x--ignore-properties: []
      x-apifox-orders:
      - errorCode
      - errorInfo
      - result
      x--orders:
      - errorCode
      - errorInfo
      - result
      x--ignore-properties: []
      x-apifox-folder: ''
    CreateSlugRecordParam:
      type: object
      properties:
        sourceObjectId:
          type: string
          description: source object id
        slug:
          type: string
          description: slug
        title:
          type: string
          description: The display title of the slug/event.
        report:
          type: string
          description: The report or description text for the slug.
        startTime:
          type: integer
          description: 'Slug start time as a Unix timestamp in milliseconds.

            When this time is reached, recording will be triggered automatically.

            Defaults to the current time if not provided.'
          format: int64
        endTime:
          type: integer
          description: 'Slug end time as a Unix timestamp in milliseconds.

            When this time is reached, recording will be stopped automatically.

            Defaults to 9999999999999 (no expiry) if not provided.'
          format: int64
        recordingType:
          type: integer
          description: 'Recording backend type. Optional.

            null or 0 - Simple slug creation, no recording is triggered.

            1 - MMA (Media Mind Application). Requires mmaRecordingParameters.

            2 - RRS (Remote Recording Service). Requires rrsRecordingParameters.'
        mmaRecordingParameters:
          $ref: '#/components/schemas/MmaRecordingParam'
          description: MMA recording configuration parameters. Required when recordingType = 1.
        rrsRecordingParameters:
          $ref: '#/components/schemas/RrsRecordingParam'
          description: RRS recording configuration parameters. Required when recordingType = 2.
      required:
      - sourceObjectId
      - slug
      x-apifox-orders:
      - sourceObjectId
      - slug
      - title
      - report
      - startTime
      - endTime
      - recordingType
      - mmaRecordingParameters
      - rrsRecordingParameters
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    RrsRecordingParam:
      type: object
      properties:
        templateId:
          type: string
          description: 'Template ID used to start the corresponding RRS module, sourced from mma-admin.

            Use "default" if no specific template is required.'
        recording:
          type: integer
          description: 'Recording switch. Defaults to enabled if not set in the template.

            0 - Close

            1 - Enable (default)'
        transcriber:
          type: integer
          description: 'Transcriber (speech-to-text) switch.

            When not set, the template''s default value is used.

            0 - Close

            1 - Enable'
        vision:
          type: integer
          description: 'Vision (AI video analysis) switch.

            When not set, the template''s default value is used.

            0 - Close

            1 - Enable'
        transcriberParameter:
          type: string
          description: 'Custom transcriber configuration in JSON string format.

            Example:{"aiproxy":{"strLanguage":"en-US"}}'
        rrsCustomParameter:
          type: string
          description: 'Custom RRS configuration in JSON string format.

            Example:{"storage_info.bucket_name":"mma-video-new"}'
      x-apifox-orders:
      - templateId
      - recording
      - transcriber
      - vision
      - transcriberParameter
      - rrsCustomParameter
      x--orders:
      - templateId
      - recording
      - transcriber
      - vision
      - transcriberParameter
      - rrsCustomParameter
      x--ignore-properties: []
      x-apifox-folder: ''
    MmaRecordingParam:
      type: object
      properties:
        livePreview:
          type: integer
          description: 'Live preview switch.

            0 - Close (default)

            1 - Enable'
        gridDistribution:
          type: integer
          description: 'Grid distribution switch.

            0 - Close (default)

            1 - Enable'
        recording:
          type: integer
          description: 'Recording switch.

            0 - Close (default)

            1 - Enable'
        speechTranscription:
          type: integer
          description: 'Speech transcription switch.

            0 - Close (default)

            1 - Enable'
        faceDetection:
          type: integer
          description: 'Face detection switch.

            0 - Close (default)

            1 - Enable'
        transcriberInfo:
          type: string
          description: 'Transcriber configuration in JSON string format.

            Example:{"LanguageCode":"en-US"}'
        sourceResolution:
          type: integer
          description: 'Source resolution setting.

            0 - 1080p60 (default)

            1 - Lower resolution

            2 - 4Kp30'
      x-apifox-orders:
      - livePreview
      - gridDistribution
      - recording
      - speechTranscription
      - faceDetection
      - transcriberInfo
      - sourceResolution
      x--orders:
      - livePreview
      - gridDistribution
      - recording
      - speechTranscription
      - faceDetection
      - transcriberInfo
      - sourceResolution
      x--ignore-properties: []
      x-apifox-folder: ''
    UpdateSlugRecordParam:
      type: object
      properties:
        slugId:
          type: string
          description: slug id
        slug:
          type: string
          description: The slug identifier string (event identifier). Optional; updates only when provided.
        title:
          type: string
          description: The display title of the slug/event. Optional; updates only when provided.
        report:
          type: string
          description: The report or description text for the slug. Optional; updates only when provided.
        startTime:
          type: integer
          description: 'Slug start time as a Unix timestamp in milliseconds. Optional; updates only when provided.

            When this time is reached, recording will be triggered automatically.'
          format: int64
        endTime:
          type: integer
          description: 'Slug end time as a Unix timestamp in milliseconds. Optional; updates only when provided.

            When this time is reached, recording will be stopped automatically.'
          format: int64
        recordingType:
          type: integer
          description: "Recording backend type. Optional.\nnull or 0 - No recording update.\n1 - MMA (Media Mind Application). Requires mmaRecordingParameters.\n    Cannot be used if the slug was originally created with RRS.\n2 - RRS (Remote Recording Service). Requires rrsRecordingParameters.\n    Cannot be used if the slug was originally created with MMA.\nIf the slug was created without recording, either type can be added here."
        mmaRecordingParameters:
          $ref: '#/components/schemas/MmaRecordingParam'
          description: MMA recording configuration parameters. Required when recordingType = 1.
        rrsRecordingParameters:
          $ref: '#/components/schemas/RrsRecordingParam'
          description: RRS recording configuration parameters. Required when recordingType = 2.
      required:
      - slugId
      x-apifox-orders:
      - slugId
      - slug
      - title
      - report
      - startTime
      - endTime
      - recordingType
      - mmaRecordingParameters
      - rrsRecordingParameters
      x--orders:
      - slugId
      - slug
      - title
      - report
      - startTime
      - endTime
      - recordingType
      - mmaRecordingParameters
      - rrsRecordingParameters
      x--ignore-properties: []
      x-apifox-folder: ''
