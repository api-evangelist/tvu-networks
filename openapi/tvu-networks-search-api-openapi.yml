openapi: 3.2.0
info:
  title: TVU Networks — Uncategorized Search API
  description: Uncategorized operations of the TVU Networks public HTTP API, assembled verbatim from the per-endpoint OpenAPI 3.0.1 exports TVU publishes on its own Apifox documentation site (https://docs.tvunetworks.cn/). Each operation body is the provider's own export; only grouping, servers[] and operationId backfill were added by API Evangelist.
  version: 1.0.0
  contact:
    name: TVU Networks
    url: https://www.tvunetworks.com/tvu-developer/
servers:
- url: https://api.tvunetworks.com
  description: Prod Env default server
tags:
- name: Search
paths:
  /search/v2/media/createSlugRecord:
    post:
      summary: Create a new slug and trigger recording
      deprecated: false
      description: 'Creates a new slug bound to the specified source object and immediately applies

        the recording configuration determined by recordingType. The authenticated user''s

        ID is resolved automatically from the request context.


        Only one recording backend is applied, strictly determined by recordingType:

        recordingType=0 uses mmaRecordingParameters, recordingType=1 uses rrsRecordingParameters.

        All switch fields (recording, livePreview, transcriber, etc.) use a unified convention:

        0=Close, 1=Enable.


        Request example (MMA, POST v2/media/createSlugRecord):

        {

        "sourceObjectId": "obj-abc123",

        "slug": "evening-news",

        "title": "Evening News",

        "report": "Daily report",

        "startTime": 1713000000000,

        "endTime": 1713003600000,

        "recordingType": 0,

        "mmaRecordingParameters":{

        "livePreview": 1,

        "gridDistribution": 0,

        "recording": 1,

        "speechTranscription": 1,

        "faceDetection": 0,

        "transcriberInfo": "{\"LanguageCode\":\"en-US\"}",

        "sourceResolution": 0

        }

        }


        Request example (RRS, POST v2/media/createSlugRecord):

        {

        "sourceObjectId": "obj-abc123",

        "title": "Evening News",

        "startTime": 1713000000000,

        "recordingType": 1,

        "rrsRecordingParameters":{

        "templateId": "default",

        "recording": 1,

        "transcriber": 1,

        "vision": 0,

        "transcriberParameter": "{\"aiproxy\":{\"strLanguage\":\"en-US\"}}",

        "rrsCustomParameter": "{\"storage_info.bucket_name\":\"mma-video-new\"}"

        }

        }


        Response example (success):

        {

        "errorCode": "0x0",

        "errorInfo": "success",

        "result": null

        }


        Response example (parameter error):

        {

        "errorCode": "80B00101",

        "errorInfo": "Parameter error",

        "result": null

        }'
