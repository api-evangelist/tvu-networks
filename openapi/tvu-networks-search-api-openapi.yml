openapi: 3.0.1
info:
  title: TVU Networks — Search API
  description: Search API operations of the TVU Networks public HTTP API, assembled verbatim from the
    per-endpoint OpenAPI 3.0.1 exports TVU publishes on its own Apifox documentation site (https://docs.tvunetworks.cn/).
    Each operation body is the provider's own export; only grouping, servers[] and operationId backfill
    were added by API Evangelist.
  version: 1.0.0
  contact:
    name: TVU Networks
    url: https://www.tvunetworks.com/tvu-developer/
servers:
- url: https://api.tvunetworks.com
  description: Prod Env default server
- url: https://search.tvunetworks.com
  description: Apifox server "TVUSearch"
paths:
  /api/import:
    get:
      summary: import test
      deprecated: false
      description: ''
      tags:
      - Search API/search
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apifox-orders: []
          headers: {}
          x-apifox-name: OK
      security: []
      x-apifox-folder: Search API/search
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-346167500-run
      operationId: import_test_346167500
      x-source-doc: https://docs.tvunetworks.cn/api-346167500.md
  /api/metadataproto/MetadataUploader.RegisterWebhook:
    post:
      summary: register webhook
      deprecated: false
      description: "register webhook\n\nwebhook  request body\n\n```\n{\n    \"status\": \"start / stop\"\
        ,\n    \"sourceObjectId\": \"1339231919795212288\",\n    \"mediaObjectId\": \"1374752064554536960\"\
        ,\n    \"previewMediaPath\": {\n        \"path\": \"http://pp-va-001.s3.us-east-1.amazonaws.com/PP/RECORDINGS/1/play.m3u8\"\
        ,\n        \"duration\": 69948450,\n        \"fileSize\": 33148124844,\n        \"startTimestamp\"\
        : 1747808030709,\n        \"endTimestamp\": 1747877979159\n    },\n    \"highResMediaPath\": {\n\
        \        \"path\": \"http://pp-va-001.s3.us-east-1.amazonaws.com/PP/RECORDINGS/1/play.m3u8\",\n\
        \        \"duration\": 69948450,\n        \"fileSize\": 33148124844,\n        \"startTimestamp\"\
        : 1747808030709,\n        \"endTimestamp\": 1747877979159\n    },\n    \"thumbnailPath\": \"http://pp-va-001.s3.us-east-1.amazonaws.com/PP/RECORDINGS/1/rec.jpg\"\
        ,\n    \"mediaFileType\": 1\n}\n\n```"
      tags:
      - Search API/public
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookURL:
                  type: string
                  description: url
                operation:
                  type: string
                  description: register / unregister
                sourceObject:
                  type: array
                  items:
                    type: string
                  description: The list of sourceObjects to be considered (if an empty list is passed,
                    then all sourceObjects are considered).
              x-apifox-refs: {}
              x-apifox-orders:
              - webhookURL
              - operation
              - sourceObject
              required:
              - webhookURL
              - operation
              - sourceObject
            example:
              webhookURL: https://vivid-hamburger.com/
              operation: register
              sourceObject:
              - '1377420057780555776'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    description: '0x0'
                  errorInfo:
                    type: string
                    description: no errror
                x-apifox-refs: {}
                x-apifox-orders:
                - errorCode
                - errorInfo
                required:
                - errorInfo
                - errorCode
              example:
                errorCode: '0x0'
                errorInfo: no errror
          headers: {}
          x-apifox-name: OK
      security: []
      x-apifox-folder: Search API/public
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-414798733-run
      operationId: register_webhook_414798733
      x-source-doc: https://docs.tvunetworks.cn/api-414798733.md
  /api/resource/v2/cut-json:
    post:
      summary: cut-json
      deprecated: false
      description: 'Cut JSON: Only modify the offset field values in the root JSON, including chunk_begin_timestamp,
        chunk_end_timestamp, begin_offset, and end_offset; the HLS source remains unchanged.'
      tags:
      - Search API/extract
      parameters:
      - name: tagvalue
        in: header
        description: ''
        required: false
        example: '{{tagvalue}}'
        schema:
          type: string
          default: '{{tagvalue}}'
      - name: SID
        in: header
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonUrl:
                  type: string
                  description: json url
                markIn:
                  type: integer
                  description: The offset of the cut start point relative to the origin.
                markOut:
                  type: integer
                  description: The offset of the cut endpoint relative to the starting point
                fileName:
                  type: string
                  description: file name
                uploadPath:
                  type: string
                  description: The upload location for the trimmed JSON file; if not specified, it defaults
                    to the same directory as the original JSON.
                pathId:
                  type: string
                  description: 'Translation: The driveId required for synchronizing the driver.'
                bucket:
                  type: string
                  description: s3 bucket
                region:
                  type: string
                  description: s3 region
                serviceCaller:
                  type: string
                  description: 'Caller identifier, for example: searchd'
              required:
              - jsonUrl
              - region
              - bucket
              - markOut
              - markIn
              - fileName
              x-apifox-orders:
              - jsonUrl
              - markIn
              - markOut
              - fileName
              - uploadPath
              - pathId
              - bucket
              - region
              - serviceCaller
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonUrl:
                    type: string
                    description: The json url after trimming
                  errorCode:
                    type: integer
                    description: error code
                  errorMessage:
                    type: string
                    description: error message
                required:
                - jsonUrl
                - errorMessage
                - errorCode
                x-apifox-orders:
                - jsonUrl
                - errorCode
                - errorMessage
          headers: {}
          x-apifox-name: OK
      security:
      - bearer: []
        x-apifox:
          schemeGroups:
          - id: pCKNfYFw3FWFznJsmvIqj
            schemeIds:
            - bearer
          required: true
          use:
            id: pCKNfYFw3FWFznJsmvIqj
          scopes:
            pCKNfYFw3FWFznJsmvIqj:
              bearer: []
      x-apifox-folder: Search API/extract
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-236527411-run
      operationId: cut_json_236527411
      x-source-doc: https://docs.tvunetworks.cn/api-236527411.md
  /api/resource/v2/export:
    post:
      summary: export
      deprecated: false
      description: ''
      tags:
      - Search API/extract
      - public
      parameters:
      - name: tagvalue
        in: header
        description: ''
        required: false
        example: '{{tagvalue}}'
        schema:
          type: string
          default: '{{tagvalue}}'
      - name: SID
        in: header
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                highResolutionMediaFilePath:
                  type: string
                  description: the corresponding hls http link
                  examples:
                  - https://mma-s3-qa.s3.ap-east-1.amazonaws.com/ts/3CB5559B28436AFA/F417ED28275DAE820000000000000001/240521-08-50-39-224/1/play.m3u8
                startTime:
                  type: integer
                  description: start time of the clipping interval
                  format: int64
                  examples:
                  - 1716281448865
                duration:
                  type: integer
                  description: duration of the clipping interval
                  format: int64
                  examples:
                  - 716000
                userAccount:
                  type: string
                  description: user account(email or userid)
                  examples:
                  - calebpan@tvunetworks.com
                withMetadataJson:
                  type: boolean
                  description: whether or not to generate metadata json
                  default: false
                sourceObjectId:
                  type: string
                  description: sourceObjectId used to generate metadata json
                fileName:
                  type: string
                  description: cut video file naming
                  examples:
                  - public_export_test
                fileType:
                  type: string
                  description: video file type, e.g. ts/mov/mp4/json
                  default: ts
                  examples:
                  - mov
                audioVolume:
                  type: string
                  description: 'set audio volume, eg: 2.0, 0.5'
                isFrameLevel:
                  type: boolean
                  description: whether or not the export is frame-accurate
                  default: false
                isCover:
                  type: boolean
                  description: Whether to overwrite existing files with the same name in history
                isDryrun:
                  type: boolean
                  description: 'all logic runs except for extracting files '
                  default: true
                isMRSS:
                  type: boolean
                  description: 'set to true to return video and thumbnail information. '
                audioAdjustment:
                  type: string
                audioPadding:
                  type: object
                  properties:
                    headLen:
                      type: number
                      description: max 5000 (ms)
                    tailLen:
                      type: number
                      description: max 5000 (ms)
                    unit:
                      type: string
                      description: ms/frame
                  description: The Audio Padding feature allows users to configure a muted audio duration
                    before and/or after a clip. Users can specify the padding in seconds or video frames,
                    and the system automatically converts between the two based on the clip's frame rate.
                  x-apifox-orders:
                  - headLen
                  - tailLen
                  - unit
                  x-apifox-ignore-properties: []
                videoPadding:
                  type: object
                  properties:
                    mode:
                      type: integer
                      description: 0(默认) -> hard black  1-> fade black
                    headLen:
                      type: integer
                    tailLen:
                      type: integer
                    unit:
                      type: string
                      description: ms/frame
                  x-apifox-orders:
                  - mode
                  - headLen
                  - tailLen
                  - unit
                  x-apifox-ignore-properties: []
                destination:
                  $ref: '#/components/schemas/PublicDestination'
                  description: upload location information
              required:
              - highResolutionMediaFilePath
              - startTime
              - duration
              - userAccount
              x-apifox-orders:
              - highResolutionMediaFilePath
              - startTime
              - duration
              - userAccount
              - withMetadataJson
              - sourceObjectId
              - fileName
              - fileType
              - audioVolume
              - isFrameLevel
              - isCover
              - isDryrun
              - isMRSS
              - audioAdjustment
              - audioPadding
              - videoPadding
              - destination
              x-apifox-ignore-properties: []
            example:
              highResolutionMediaFilePath: https://tvu-tbs-project.s3.ap-northeast-1.amazonaws.com/ts/FFFFFFF0000E5612/143FEF1EF65B38970000000000000002/240527-05-11-16-159/181/play.m3u8
              startTime: 1732035540427
              duration: 180000
              userAccount: calebpan@tvunetworks.com
              fileName: soffee-20241120
              fileType: ts
              isFrameLevel: false
              isDryrun: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: integer
                    description: error code
                  errorMsg:
                    type: string
                    description: error message
                  isDryrun:
                    type: boolean
                    description: 'All logic runs except for extracting files '
                  timeWait:
                    type: integer
                    description: (ms) This non-blocking API returns this value that helps decide when
                      to retry the operation.  if it’s 0 ,  videoPath is the real file path.
                  videoPath:
                    type: string
                    description: Full path and pre-signed for 1 hours (if the video file not be public-read)
                  baseVideoPath:
                    type: string
                    description: No signature export video link
                  metadataJsonPath:
                    type: string
                    description: Full path or pre-signed for 1 hours (if ihe metadata json file not be
                      public-read)
                  baseMetadataJsonPath:
                    type: string
                    description: No signature export metadata json link
                  thumbnailInfo:
                    type: object
                    properties:
                      url:
                        type: string
                      width:
                        type: string
                      height:
                        type: string
                    x-apifox-orders:
                    - url
                    - width
                    - height
                    x-apifox-ignore-properties: []
                  videoInfo:
                    type: object
                    properties:
                      url:
                        type: string
                      type:
                        type: string
                      bitrate:
                        type: string
                      width:
                        type: string
                      height:
                        type: string
                      framerate:
                        type: string
                      duration:
                        type: string
                    x-apifox-orders:
                    - url
                    - type
                    - bitrate
                    - width
                    - height
                    - framerate
                    - duration
                    x-apifox-ignore-properties: []
                  videoDuration:
                    type: integer
                    description: video file length
                    format: int64
                  fileSize:
                    type: integer
                    description: video file size
                    format: int64
                required:
                - errorCode
                - errorMsg
                - isDryrun
                - timeWait
                - videoPath
                - baseVideoPath
                - metadataJsonPath
                - baseMetadataJsonPath
                - videoDuration
                - fileSize
                x-apifox-orders:
                - errorCode
                - errorMsg
                - isDryrun
                - timeWait
                - videoPath
                - baseVideoPath
                - metadataJsonPath
                - baseMetadataJsonPath
                - thumbnailInfo
                - videoInfo
                - videoDuration
                - fileSize
                x-apifox-ignore-properties: []
          headers: {}
          x-apifox-name: OK
      security:
      - bearer: []
        x-apifox:
          schemeGroups:
          - id: KXaVv6qS2vTxEg6zy9eVx
            schemeIds:
            - bearer
          required: true
          use:
            id: KXaVv6qS2vTxEg6zy9eVx
          scopes:
            KXaVv6qS2vTxEg6zy9eVx:
              bearer: []
      x-apifox-folder: Search API/extract
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-236527410-run
      operationId: export_236527410
      x-source-doc: https://docs.tvunetworks.cn/api-236527410.md
