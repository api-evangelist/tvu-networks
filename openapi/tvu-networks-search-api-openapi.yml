  /api/search/v1/i/words:
    get:
      summary: Retrieve caption transcript within a media time range
      deprecated: false
      description: Returns speech-to-text caption segments (each containing transcript text and start/end
        timestamps) from a broadcast recording within the specified time window. Identify the recording
        using 'peerid' (TVU device peer ID) and 'ph_path' (placeholder file path). 'pathtype' must be
        provided to route the request correctly, and 'language_type' must match the language used during
        transcription. Use this to extract the spoken transcript for any segment of a live or recorded
        broadcast. Session ID required.
      tags:
      - Search API/search/caption
      - caption
      parameters:
      - name: uid
        in: query
        description: Unique identifier of the media file (MPD path). Can be omitted when peerid is provided.
        required: false
        schema:
          type: string
      - name: ph_path
        in: query
        description: Placeholder file path identifying the media recording.
        required: true
        schema:
          type: string
      - name: peerid
        in: query
        description: TVU device peer ID (e.g. 'A1B2C3D4'). Identifies the source recording device.
        required: true
        schema:
          type: string
      - name: pathtype
        in: query
        description: Type/category of the media path. Required to route the query correctly.
        required: true
        schema:
          type: string
      - name: starttime
        in: query
        description: Start of the search time range, in Unix milliseconds.
        required: true
        schema:
          type: integer
      - name: endtime
        in: query
        description: End of the search time range, in Unix milliseconds. Must be >= starttime.
        required: true
        schema:
          type: integer
      - name: language_type
        in: query
        description: Language/locale code of the caption to search (e.g. 'en-US', 'zh'). Must match the
          language used during transcription.
        required: true
        schema:
          type: string
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
