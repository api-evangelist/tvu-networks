      properties:
        '-':
          type: integer
        docid:
          description: Unique identifier of the clicked document within the index.
          type: string
        index:
          description: Elasticsearch index name that the clicked document belongs to.
          type: string
        lang:
          description: Language of the search query (e.g. 'en', 'zh'). Optional.
          type: string
        order:
          description: Page number the user was on when clicking. Set to 1 to also log query statistics.
          type: integer
        ph_path:
          description: Placeholder file path associated with the clicked document. Optional.
          type: string
        query:
          description: The search query string that produced the result the user clicked on.
          type: string
        rank:
          description: Position of the result within the current search page (1-based).
          type: integer
        sessionid:
          description: Active session ID of the user, used to verify the request.
          type: string
        userid:
          description: User account/email that performed the click.
          type: string
      x-apifox-orders:
      - '-'
      - docid
      - index
      - lang
      - order
      - ph_path
      - query
      - rank
      - sessionid
      - userid
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    controllers.UpdateClickCntResp:
      type: object
      properties:
        code:
          type: integer
        json:
          type: object
          additionalProperties: true
          x-apifox-orders: []
          properties: {}
          x-apifox-ignore-properties: []
        message:
          type: string
      x-apifox-orders:
      - code
      - json
      - message
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    controllers.GetVersionResponse:
      type: object
      properties:
        version:
          type: string
      x-apifox-orders:
      - version
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    controllers.AgentSearchReq:
      type: object
      properties:
        memoryId:
          description: Session memory ID for conversational context; pass empty string to start a new
            session
          type: string
        pageNum:
          description: Page number for pagination, starting from 1
          type: integer
        pageSize:
          description: Number of results per page
          type: integer
        query:
          description: Natural language search query
          type: string
      x-apifox-orders:
      - memoryId
      - pageNum
      - pageSize
      - query
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    controllers.AgentSearchResp:
      type: object
      properties:
        errorCode:
          description: 'Business result code: 0=success, 2002=no results, 2004=invalid request, 2008=access
            denied'
          type: integer
        errorInfo:
          description: Human-readable result message
          type: string
        result:
          description: Search result payload
          allOf:
          - $ref: '#/components/schemas/controllers.AgentSearchItems'
      x-apifox-orders:
      - errorCode
      - errorInfo
      - result
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    controllers.AgentSearchItems:
      type: object
      properties:
        list:
          description: List of matched search items
          type: array
          items:
            type: string
        memoryId:
          description: Session memory ID; pass this value in subsequent requests to maintain conversation
            context
          type: string
        size:
          description: Number of items in the current response
          type: integer
        total:
          description: Total number of matching items
          type: integer
      x-apifox-orders:
      - list
      - memoryId
      - size
      - total
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    models.AppearanceRelationsRequestV2:
      type: object
      properties:
        appearanceId:
          description: Filter by specific appearance ID
          type: string
        detectionTypes:
          description: 'Filter by detection type: 0=known person, 1=unknown person, 2=logo/brand, 3=text/number'
          type: array
          items:
            type: integer
        endTimestamp:
          description: Search end time in milliseconds; defaults to current time
          type: integer
        language:
          description: Language code for search (e.g., en, cn)
          type: string
        pageNum:
          description: Page number, starting from 1
          type: integer
        pageSize:
          description: Number of results per page
          type: integer
        query:
          description: Text query to filter appearances by name
          type: string
        sourceObjects:
          description: List of source object IDs to query appearance relations for; required
          type: array
          items:
            type: string
        startTimestamp:
          description: Search start time in milliseconds; defaults to 7 days ago
          type: integer
      x-apifox-orders:
      - appearanceId
      - detectionTypes
      - endTimestamp
      - language
      - pageNum
      - pageSize
      - query
      - sourceObjects
      - startTimestamp
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    models.AppearanceSuggestionRequestV2:
      type: object
      properties:
        appearanceType:
          description: 'Filter by appearance class type: 0=logo/brand, 1=text/number, 2=person/face'
          type: integer
        language:
          description: Language code for search (e.g., en, cn, es)
          type: string
        pageNum:
          description: Page number, starting from 1
          type: integer
        pageSize:
          description: Number of suggestions per page
          type: integer
        query:
          description: Search prefix for autocomplete
          type: string
        sourceObjectIds:
          description: List of source object IDs to search within; required
          type: array
          items:
            type: string
      x-apifox-orders:
      - appearanceType
      - language
      - pageNum
      - pageSize
      - query
      - sourceObjectIds
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
