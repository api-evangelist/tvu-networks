          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: MediaHub API/destination-api
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-430970840-run
      x-source-doc: https://docs.tvunetworks.cn/api-430970840.md
    post:
      summary: createDestination
      deprecated: false
      description: create destination
      operationId: createDestination
      tags:
      - MediaHub API/destination-api
      parameters:
