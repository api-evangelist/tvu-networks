      summary: deleteDestination
      deprecated: false
      description: delete destination by objectId
      operationId: deleteDestination
      tags:
      - MediaHub API/destination-api
      parameters:
      - name: objectId
        in: query
        description: ''
        required: true
        schema:
          type: string
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
