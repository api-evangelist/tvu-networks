components:
  schemas:
    ResponseResult:
      type: object
      properties:
        errorCode:
          type: string
          examples:
          - '0x0'
        errorInfo:
          type: string
          examples:
          - success
        result:
          type: object
          x-apifox-orders: []
          properties: {}
          x-apifox-ignore-properties: []
        async:
          type: boolean
        errorBody:
          type: object
          x-apifox-orders: []
          properties: {}
          x-apifox-ignore-properties: []
      x-apifox-orders:
      - errorCode
      - errorInfo
      - result
      - async
      - errorBody
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    ResultPageResultDestinationVO:
      type: object
      properties:
        errorCode:
          type: string
        errorInfo:
          type: string
        result:
          $ref: '#/components/schemas/PageResultDestinationVO'
      x-apifox-orders:
      - errorCode
      - errorInfo
      - result
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    DestinationVO:
      required:
      - type
      - outputName
      type: object
      properties:
        type:
          type: string
          description: support HLS/SRT/NDI/SDI/RTMP
          default: SRT
        outputName:
          type: string
        url:
          type: string
          description: NDI No URL required
          default: srt://demo-zzhforrum.tvustream.com:47087?mode=caller&latency=120000
        objectId:
          type: string
      x-apifox-orders:
      - type
      - outputName
      - url
      - objectId
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    OutputDTO:
      required:
      - type
      - outputName
      - id
      type: object
      properties:
        type:
          type: string
          description: support HLS/SRT/NDI/SDI/RTMP
          default: SRT
        outputName:
          type: string
        url:
          type: string
          description: NDI No URL required
          default: srt://demo-zzhforrum.tvustream.com:47087?mode=caller&latency=120000
        id:
          type: string
          description: outputId
        objectId:
          type: string
      x-apifox-orders:
      - type
      - outputName
      - url
      - id
      - objectId
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    OutputQueryDTO:
      required:
      - pageSize
      - pageNum
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
          examples:
          - 10
        pageNum:
          type: integer
          format: int32
          examples:
          - 1
        outputName:
          type: string
        liveOnly:
          type: boolean
          description: Filter the output being streamed
      x-apifox-orders:
      - pageSize
      - pageNum
      - outputName
      - liveOnly
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    PageResultDestinationVO:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/DestinationVO'
        pageNum:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        pages:
          type: integer
          format: int64
      x-apifox-orders:
      - list
      - pageNum
      - pageSize
      - total
      - pages
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    DestinationObjectEncodingProfileDTO:
      type: object
      properties:
        destinationObjectId:
          type: string
        encodingProfileId:
          type: string
      x-apifox-orders:
      - destinationObjectId
      - encodingProfileId
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    ResultDestinationVO:
      type: object
      properties:
        errorCode:
          type: string
        errorInfo:
          type: string
        result:
          $ref: '#/components/schemas/DestinationVO'
      x-apifox-orders:
      - errorCode
      - errorInfo
      - result
      x--orders:
      - errorCode
      - errorInfo
      - result
      x--ignore-properties: []
      x-apifox-folder: ''
    Result:
      type: object
      properties:
        errorCode:
          type: string
        errorInfo:
          type: string
        result:
          type: object
          x-apifox-orders: []
          properties: {}
          x-apifox-ignore-properties: []
      x-apifox-orders:
      - errorCode
      - errorInfo
      - result
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    CreateOutputDTO:
      required:
      - type
      - outputName
      type: object
      properties:
        type:
          type: string
          description: support HLS/SRT/NDI/SDI/RTMP
          default: SRT
        outputName:
          type: string
        url:
          type: string
          description: NDI No URL required
          default: srt://demo-zzhforrum.tvustream.com:47087?mode=caller&latency=120000
      x-apifox-orders:
      - type
      - outputName
      - url
      x--orders:
      - type
      - outputName
      - url
      x--ignore-properties: []
      x-apifox-folder: ''
  securitySchemes:
    bearer:
      type: bearer
      scheme: bearer
    apikey-header-Authorization:
      type: apikey
      in: header
      name: Authorization
    apikey-header-SID:
      type: apikey
      in: header
      name: SID
    tvu:
      type: bearer
      scheme: bearer
