openapi: 3.2.0
info:
  title: TVU Networks — Object Object API/RESTful API
  description: Object API operations of the TVU Networks public HTTP API, assembled verbatim from the per-endpoint OpenAPI 3.0.1 exports TVU publishes on its own Apifox documentation site (https://docs.tvunetworks.cn/). Each operation body is the provider's own export; only grouping, servers[] and operationId backfill were added by API Evangelist.
  version: 1.0.0
  contact:
    name: TVU Networks
    url: https://www.tvunetworks.com/tvu-developer/
servers:
- url: https://api.tvunetworks.com
  description: Prod Env default server
- url: https://mma.tvunetworks.com
  description: Apifox server "MMA"
tags:
- name: Object API/RESTful
paths:
  /api/objectd/v1/attr:
    put:
      summary: update object attributes
      deprecated: false
      description: ''
      operationId: /api/objectd/v1/attr
      tags:
      - Object API/RESTful
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: object01
        in: cookie
        description: ''
        required: false
        example: 01daily1
        schema:
          type: string
          default: 01daily1
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actions:
                  type: array
                  items:
                    type: object
                    properties:
                      objectId:
                        type: string
                        description: The objectId to update. The parameters `objectId` and `objectIdList` must include at least one of them. | | objectIdList | yes | []string | The objectIds to update. The parameters `objectId` and `objectIdList` must include at least one of them.|
                      objectIdList:
                        type: array
                        items:
                          type: string
                        description: The objectId List to update. The parameters `objectId` and `objectIdList` must include at least one of them. | | objectIdList | yes | []string | The objectIds to update. The parameters `objectId` and `objectIdList` must include at least one of them.|
                      attrName:
                        type: string
                        description: 'Properties to be updated are currently supported:

                          `tag` Update the tag list.

                          `admin.users` Update the user list for admin permissions.

                          `admin.groups` Update the group list for admin permissions.

                          `owner.users` Update the user list for owner permissions.

                          `owner.groups` Update the group list for owner permissions.

                          `feature.{featureName}.users` Update the user list for feature permissions, where featureName is the name of the corresponding feature.

                          `feature.{featureName}.groups`  Update the group list for feature permissions, where featureName is the name of the corresponding feature.

                          `attributes.{attributesName}`  Update attributes, where attributesName is the name of the corresponding attribute.'
                      operator:
                        type: string
                        description: 'Currently, three types of update operations are supported:  `add` means to add a new element, `remove` means  to delete a specific element, `update` means to overwrite all values. `remove_all` means to delete all element.'
                      attrValue:
                        type: array
                        items:
                          type: string
                        description: The attribute values to be changed.
                    required:
                    - objectId
                    - attrName
                    - operator
                    - attrValue
                    - objectIdList
                    x-apifox-orders:
                    - objectId
                    - objectIdList
                    - attrName
                    - operator
                    - attrValue
                  description: Update the task list
              required:
              - actions
              x-apifox-orders:
              - actions
            example:
              actions:
              - objectId: '1'
                attrName: feature.takelive.groups
                operator: remove_all
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                  errorInfo:
                    type: string
                required:
                - errorCode
                - errorInfo
                x-apifox-orders:
                - errorCode
                - errorInfo
              example:
                errorCode: '0x0'
                errorInfo: Succ
          headers: {}
          x-apifox-name: Success
      security:
      - bearer: []
        x-apifox:
          schemeGroups:
          - id: 0TWm6z0znVGySCUfQa4dZ
            schemeIds:
            - bearer
          required: true
          use:
            id: 0TWm6z0znVGySCUfQa4dZ
          scopes:
            0TWm6z0znVGySCUfQa4dZ:
              bearer: []
      x-apifox-folder: Object API/RESTful
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-321782315-run
      x-source-doc: https://docs.tvunetworks.cn/api-321782315.md
    get:
      summary: get objects' attribute
      deprecated: false
      description: ''
      operationId: /api/objectd/v1/attr
      tags:
