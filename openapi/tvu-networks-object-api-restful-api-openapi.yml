  /api/objectd/v1/tag:
    post:
      summary: create object tag
      deprecated: false
      description: Create an object tag using the specified parameters. This API will return the original data that exists in the database.
      tags:
      - Object API/RESTful
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: object01
        in: cookie
        description: ''
        required: false
        example: 01daily1
        schema:
          type: string
          default: 01daily1
