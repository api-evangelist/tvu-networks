                    type: string
                  errorInfo:
                    type: string
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        objectId:
                          type: string
                          description: the ID of the Object
                        attrName:
                          type: string
                          description: The attrName of the search. If there are multiple attributes obtained, only return the first attribute (this is done for compatibility, as it may be deleted at any time in the future)
                        attrValue:
                          type: array
                          items:
                            type: string
                          description: the value of the attrName. If there are multiple attributes obtained, only return the first attribute (this is done for compatibility, as it may be deleted at any time in the future)
                        attrList:
                          type: array
                          items:
                            type: object
                            properties:
                              attrName:
                                type: string
                              attrValue:
                                type: string
                            x-apifox-orders:
                            - attrName
                            - attrValue
                          description: Multi-attribute list
                      required:
                      - objectId
                      - attrList
                      x-apifox-orders:
                      - objectId
                      - attrName
                      - attrValue
                      - attrList
                    description: the result of the search
                required:
                - errorCode
                - errorInfo
                - result
                x-apifox-orders:
                - errorCode
                - errorInfo
                - result
              example:
                errorCode: '0x0'
                errorInfo: Succ
          headers: {}
          x-apifox-name: Success
