      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tagName:
                  type: string
                  description: The name of the object tag.
                classification:
                  type: integer
                  description: 'Object tag permissions:  0 - Private 1 - Group 2 - Public 3 - Admin'
                groupId:
                  type: string
                  description: The group object tag requires setting group permissions, defaulting to the user's root group.
                userId:
                  type: string
                  description: The private object tag requires setting user permissions, defaulting to the gateway user ID.
              required:
              - tagName
              - classification
              x-apifox-orders:
              - tagName
              - classification
              - groupId
              - userId
            example:
              tagName: soffee-123
              classification: 0
              groupId: 16d219d093fe4d268a721bbce00d7de8
              userId: 95cd9476f8d74ad0a4b2be0d78b0ccb1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    description: error code
                  errorInfo:
                    type: string
                    description: error Information
                  result:
                    type: object
                    properties:
                      tagId:
                        type: string
                        description: The ID of the object tag.
                      tagName:
                        type: string
                        description: The name of the object tag.
                      classification:
                        type: integer
                        description: The permission type of the object tag.
                      groupId:
                        type: string
                        description: The group permissions of the object
