openapi: 3.2.0
info:
  title: TVU Networks — MediaHub MediaHub API/RouteApi API
  description: MediaHub API operations of the TVU Networks public HTTP API, assembled verbatim from the per-endpoint OpenAPI 3.0.1 exports TVU publishes on its own Apifox documentation site (https://docs.tvunetworks.cn/). Each operation body is the provider's own export; only grouping, servers[] and operationId backfill were added by API Evangelist.
  version: 1.0.0
  contact:
    name: TVU Networks
    url: https://www.tvunetworks.com/tvu-developer/
servers:
- url: https://api.tvunetworks.com
  description: Prod Env default server
- url: https://mediahub.tvunetworks.com
  description: Apifox server "MediaHub"
tags:
- name: MediaHub API/RouteApi
paths:
  /mediahub/api/v2/route/destination/connect:
    post:
      summary: destinationStartLive(destination mode)
      deprecated: false
      description: 'Start live streaming in destination mode (one-to-one: sourceObject → destinationObject). The caller must supply sourceObjectId, destinationObjectId and appName. userId and email are resolved automatically from the Authorization token.'
      operationId: destinationStartLive
      tags:
      - MediaHub API/RouteApi
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationLiveDTO'
            example:
              sourceObjectId: src_a1b2c3d4e5f6
              destinationObjectId: dst_a1b2c3d4e5f6
              appName: live
              enablePreview: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseResult'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: MediaHub API/RouteApi
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-430970839-run
      x-source-doc: https://docs.tvunetworks.cn/api-430970839.md
  /mediahub/api/v2/route/destination/disconnect:
    post:
      summary: destinationStopLive(destination mode)
      deprecated: false
      description: Stop live streaming for the specified destination object. Only destinationObjectId is required in the request body.
      operationId: destinationStopLive
      tags:
      - MediaHub API/RouteApi
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationLiveDTO'
            example:
              sourceObjectId: src_a1b2c3d4e5f6
              destinationObjectId: dst_a1b2c3d4e5f6
              appName: live
              enablePreview: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseResult'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: MediaHub API/RouteApi
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-430970838-run
      x-source-doc: https://docs.tvunetworks.cn/api-430970838.md
  /mediahub/api/v2/route/destination/switch:
    post:
      summary: destinationSwitch(destination mode)
      deprecated: false
      description: Switch the source of an active destination stream to a new source object. sourceObjectId, destinationObjectId and appName are required.
      operationId: destinationSwitch
      tags:
      - MediaHub API/RouteApi
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationLiveDTO'
            example:
              sourceObjectId: src_a1b2c3d4e5f6
              destinationObjectId: dst_a1b2c3d4e5f6
              appName: live
              enablePreview: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseResult'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: MediaHub API/RouteApi
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-430970837-run
      x-source-doc: https://docs.tvunetworks.cn/api-430970837.md
  /mediahub/api/v2/route/connect:
    post:
      summary: connect(project mode)
      deprecated: false
      description: ''
      operationId: connect
      tags:
      - MediaHub API/RouteApi
      parameters:
