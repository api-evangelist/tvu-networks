components:
  schemas:
    ResponseResult:
      type: object
      properties:
        errorCode:
          type: string
          examples:
          - '0x0'
        errorInfo:
          type: string
          examples:
          - success
        result:
          type: object
          x-apifox-orders: []
          properties: {}
          x-apifox-ignore-properties: []
        async:
          type: boolean
        errorBody:
          type: object
          x-apifox-orders: []
          properties: {}
          x-apifox-ignore-properties: []
      x-apifox-orders:
      - errorCode
      - errorInfo
      - result
      - async
      - errorBody
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    DestinationLiveDTO:
      required:
      - sourceObjectId
      - destinationObjectId
      - appName
      type: object
      properties:
        sourceObjectId:
          type: string
          description: Source object ID (the input source to stream from)
          examples:
          - src_a1b2c3d4e5f6
        destinationObjectId:
          type: string
          description: Destination object ID (the output target to stream to)
          examples:
          - dst_a1b2c3d4e5f6
        appName:
          type: string
          description: App name / stream key used by the encoder
          examples:
          - live
        businessId:
          type: string
          description: Business ID, defaults to destinationObjectId when not provided
          examples:
          - dst_a1b2c3d4e5f6
        enablePreview:
          type: boolean
          description: Whether to enable preview output
          examples:
          - false
        previewType:
          type: integer
          description: 'Preview type: 0 = SRT, 1 = HLS'
          format: int32
          examples:
          - 0
        graphMetadata:
          type: object
          additionalProperties:
            type: string
            description: Extra metadata passed to the encoder graph (key-value pairs)
            examples:
            - '{"key1":"value1"}'
          description: Extra metadata passed to the encoder graph (key-value pairs)
          x-apifox-orders: []
          examples:
          - key1: value1
          properties: {}
          x-apifox-ignore-properties: []
      description: Destination live start/stop request
      x-apifox-orders:
      - sourceObjectId
      - destinationObjectId
      - appName
      - businessId
      - enablePreview
      - previewType
      - graphMetadata
      examples:
      - sourceObjectId: src_a1b2c3d4e5f6
        destinationObjectId: dst_a1b2c3d4e5f6
        appName: live
        enablePreview: false
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    ConnectDTO:
      required:
      - sourceObjectId
      type: object
      properties:
        sourceObjectId:
          type: string
          description: Source object ID (input device/stream)
          examples:
          - src_a1b2c3d4e5f6
        force:
          type: boolean
          description: Force connect even if already streaming
          examples:
          - false
        projectObjectId:
          type: string
          description: Project object ID
          examples:
          - prj_a1b2c3d4e5f6
        pairIds:
          type: array
          items:
            type: string
            description: Pair ID
            examples:
            - pair_a1b2c3
          description: Output encoding profile pair IDs to enable; leave empty to use all
          examples:
          - - pair_a1b2c3
            - pair_d4e5f6
        openPreview:
          type: boolean
          description: Enable preview stream
          examples:
          - false
        graphMetadata:
          type: object
          additionalProperties:
            type: string
            description: metadata value
            examples:
            - 4000k
          description: Extra key-value metadata passed to the encoder graph
          x-apifox-orders: []
          examples:
          - resolution: 1920x1080
            bitrate: 4000k
          properties: {}
          x-apifox-ignore-properties: []
      x-apifox-orders:
      - sourceObjectId
      - force
      - projectObjectId
      - pairIds
      - openPreview
      - graphMetadata
      examples:
      - projectObjectId: prj_a1b2c3d4e5f6
        sourceObjectId: src_a1b2c3d4e5f6
        force: false
        pairIds:
        - pair_a1b2c3
        - pair_d4e5f6
        openPreview: false
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    ResponseResultString:
      type: object
      properties:
        errorCode:
          type: string
          examples:
          - '0x0'
        errorInfo:
          type: string
          examples:
          - success
        async:
          type: boolean
        result:
          type: string
      x-apifox-orders:
      - errorCode
      - errorInfo
      - async
      - result
      x--orders:
      - errorCode
      - errorInfo
      - async
      - result
      x--ignore-properties: []
      x-apifox-folder: ''
    SwitchConnectDTO:
      required:
      - projectObjectId
      type: object
      properties:
        projectObjectId:
          type: string
          description: Project object ID
          examples:
          - prj_a1b2c3d4e5f6
        sourceObjectId:
          type: string
          description: New source object ID to switch to
          examples:
          - src_x9y8z7w6v5u4
      x-apifox-orders:
      - projectObjectId
      - sourceObjectId
      examples:
      - projectObjectId: prj_a1b2c3d4e5f6
        sourceObjectId: src_x9y8z7w6v5u4
      x--orders:
      - projectObjectId
      - sourceObjectId
      x--ignore-properties: []
      x-apifox-folder: ''
    DisableOutputDTO:
      required:
      - outputEncodingProfilePairId
      type: object
      properties:
        projectObjectId:
          type: string
          description: Project object ID
          examples:
          - prj_a1b2c3d4e5f6
        outputEncodingProfilePairId:
          type: string
          description: OutputEncodingProfileAirId can be obtained from the paired API
          examples:
          - pair_a1b2c3d4e5f6
      x-apifox-orders:
      - projectObjectId
      - outputEncodingProfilePairId
      examples:
      - projectObjectId: prj_a1b2c3d4e5f6
        outputEncodingProfilePairId: pair_a1b2c3d4e5f6
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    EnableOutputDTO:
      required:
      - outputEncodingProfilePairId
      type: object
      properties:
        projectObjectId:
          type: string
          description: Project object ID
          examples:
          - prj_a1b2c3d4e5f6
        outputEncodingProfilePairId:
          type: string
          description: OutputEncodingProfileAirId can be obtained from the paired API
          examples:
          - pair_a1b2c3d4e5f6
      x-apifox-orders:
      - projectObjectId
      - outputEncodingProfilePairId
      examples:
      - projectObjectId: prj_a1b2c3d4e5f6
        outputEncodingProfilePairId: pair_a1b2c3d4e5f6
      x--orders:
      - projectObjectId
      - outputEncodingProfilePairId
      x--ignore-properties: []
      x-apifox-folder: ''
    ProjectDTO:
      type: object
      properties:
        projectObjectId:
          type: string
          description: Project object ID
          examples:
          - prj_a1b2c3d4e5f6
      x-apifox-orders:
      - projectObjectId
      examples:
      - projectObjectId: prj_a1b2c3d4e5f6
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
  securitySchemes:
    bearer:
      type: bearer
      scheme: bearer
    apikey-header-Authorization:
      type: apikey
      in: header
      name: Authorization
    apikey-header-SID:
      type: apikey
      in: header
      name: SID
    tvu:
      type: bearer
      scheme: bearer
