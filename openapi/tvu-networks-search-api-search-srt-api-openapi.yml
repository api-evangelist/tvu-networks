- url: https://api.tvunetworks.com
  description: Prod Env default server
- url: https://search.tvunetworks.com
  description: Apifox server "TVUSearch"
tags:
- name: Search API/search/srt
paths:
  /api/search/v1/i/marksrt:
    post:
      summary: Generate a marked SRT subtitle file
      deprecated: false
      description: Generates an SRT subtitle file for the specified media segment and mark range, returning the output file path.
      tags:
      - Search API/search/srt
      parameters:
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                accessTime:
                  type: integer
                  format: int64
                  example: 0
                enableTimeCode:
                  description: enableTimeCode query bool true "enableTimeCode"
                  type: boolean
                  example: ''
                export_filename:
                  description: export_filename query string true "export_filename" None
                  type: string
                  example: ''
                file_start_ts:
                  description: file_start_ts query int64 true "file_start_ts" 0
                  type: integer
                  default: 0
                  example: 0
                filename:
                  description: filename query string true "filename" None
                  type: string
                  example: ''
                filetype:
                  description: filetype query string true "filetype"
                  type: string
                  example: ''
                languagetype:
                  description: languagetype query string true "languagetype"
                  type: string
                  example: ''
                mark_end:
                  description: mark_end query int64 true "mark_end" 0
                  type: integer
                  example: 0
                mark_start:
                  description: mark_start query int64 true "mark_start" 0
                  type: integer
                  example: 0
                pathtype:
                  description: pathtype query string true "pathtype"
                  type: string
                  example: ''
                peerid:
                  description: peerid query string true "peerid"
                  type: string
                  example: ''
                ph_path:
                  description: ph_path query string true "ph_path"
                  type: string
                  example: ''
                search_end_ts:
                  description: search_end_ts query int64 true "search_end_ts" 0
                  type: integer
                  example: 0
                search_start_ts:
                  description: search_start_ts query int64 true "search_start_ts" 0
                  type: integer
                  example: 0
                sessionid:
                  description: sessionid query string true "sessionid"
                  type: string
                  example: ''
                source_object_id:
                  description: source object id query string true
                  type: string
                  example: ''
                timeOffset:
                  description: timeOffset config the offset of subtitle appearance time
                  type: integer
                  example: 0
                time_of_day_frequency:
                  description: Maximum word-frequency length supported in time-of-day format
                  type: integer
                  example: 0
                time_zone:
                  description: Special time value used to designate the subtitle start/end time
                  type: string
                  example: ''
                uid:
                  description: uid query string true "uid" None
                  type: string
                  example: ''
                userid:
                  description: userid query string true "userid"
                  type: string
                  example: ''
      responses:
        '200':
          description: 'Successful response; check code field for logical results: 0=success, 1001=invalid request, 1002=invalid session, 1404=access denied'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.GenMarkSrtResp'
          headers: {}
          x-apifox-name: ''
        '400':
          description: Malformed HTTP request or parse error
