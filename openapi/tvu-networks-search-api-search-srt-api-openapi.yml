    controllers.GenMarkSrtResp:
      type: object
      properties:
        code:
          description: 'Response code: 0=success, 1001=invalid request, 1002=invalid session, 1404=access denied'
          type: integer
        data:
          description: File path of the generated SRT file, if successful
          type: string
        message:
          description: Human-readable result message
          type: string
      x-apifox-orders:
      - code
      - data
      - message
