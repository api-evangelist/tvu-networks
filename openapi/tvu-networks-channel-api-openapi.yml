                - errorCode
                - errorInfo
                - result
                x-apifox-orders:
                - errorCode
                - errorInfo
                - result
              example:
                errorCode: '0x0'
                errorInfo: Success
                result: 55524c204558544c000011917efddbdf
          headers: {}
          x-apifox-name: Success
