      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - Media
                  - File
                  - Ext
                  x-apifox-enum:
                  - value: Media
                    name: Media
                    description: Media In Drive
                  - value: File
                    name: File
                    description: Json File In Drive
                  - value: Ext
                    name: Ext
                    description: LiveSource In CC
                  examples:
                  - Media
                  description: Source Type; Media/File/Ext
                name:
                  type: string
                  description: SourceName
                  minLength: 1
                  maxLength: 255
                  examples:
                  - 01.mp4
              required:
              - type
              - name
              x-apifox-orders:
              - type
              - name
            example:
              type: Media
              name: 01.mp4
