    MergeVideoRes:
      type: object
      properties:
        ErrorCode:
          type: integer
          description: '- `0` — Merge complete

            - `1` — Still processing

            - Other — Error (see endpoint description)

            '
          examples:
          - 0
        ErrorMessage:
          type: string
          examples:
          - success
        VideoPath:
          type: string
          description: Object key of the merged output file. Populated when `ErrorCode == 0`.
          examples:
          - merged/final.mp4
        VideoUrl:
          type: string
          description: Public HTTP(S) URL for the merged output file.
          examples:
          - https://media-export-bucket.s3.us-east-1.amazonaws.com/merged/final.mp4
        TimeWait:
          type: integer
          format: int64
          description: Milliseconds to wait before the next poll. `0` when done or errored.
          examples:
          - 0
      x-apifox-orders:
      - ErrorCode
      - ErrorMessage
      - VideoPath
      - VideoUrl
      - TimeWait
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    CutJsonReqV2:
      type: object
      required:
      - jsonUrl
      - markIn
      - markOut
      properties:
        jsonUrl:
          type: string
          description: HTTP(S) URL of the source JSON edit list / timeline file.
          format: uri
          examples:
          - https://mma-video-new.s3.us-east-1.amazonaws.com/export/story.json
        markIn:
          type: integer
          format: int64
          description: Cut-in point in **milliseconds** (relative to the beginning of the JSON timeline).
          examples:
          - 5000
        markOut:
          type: integer
          format: int64
          description: Cut-out point in **milliseconds**. Must be strictly greater than `markIn`.
          examples:
          - 65000
        fileName:
          type: string
          description: Output JSON base name. The service appends `_<timestamp>_<duration>.json`.
          examples:
          - story_trimmed
        uploadPath:
          type: string
          description: S3 key prefix for the output file.
          examples:
          - trimmed/
        PathId:
          type: string
          description: Internal path identifier.
        Bucket:
          type: string
          description: Target S3 bucket for the output JSON file.
          examples:
          - media-export-bucket
        Region:
          type: string
          description: AWS region of the target bucket.
          examples:
          - us-east-1
        serviceCaller:
          type: string
          description: Identifier of the upstream service making this request.
      x-apifox-orders:
      - jsonUrl
      - markIn
      - markOut
      - fileName
      - uploadPath
      - PathId
      - Bucket
      - Region
      - serviceCaller
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    CutJsonRes:
      type: object
      properties:
        errorCode:
          type: integer
          description: '- `0` — Success

            - `3001` — Source JSON URL is invalid or unreachable

            - `3002` — JSON content format is invalid

            - `3003` — Bucket configuration error

            - `3004` — Output upload failed

            '
          examples:
          - 0
        errorMessage:
          type: string
          examples:
          - success
        jsonUrl:
          type: string
          description: HTTP(S) URL to the trimmed output JSON file. Empty on error.
          examples:
          - https://media-export-bucket.s3.us-east-1.amazonaws.com/trimmed/story_trimmed_20231114_120000_60000.json
      x-apifox-orders:
      - errorCode
      - errorMessage
      - jsonUrl
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
  securitySchemes:
    bearer:
      type: bearer
      scheme: bearer
    apikey-header-Authorization:
      type: apikey
      in: header
      name: Authorization
    apikey-header-SID:
      type: apikey
      in: header
      name: SID
    tvu鉴权:
      type: bearer
      scheme: bearer
