          - 0
        videoPath:
          type: string
          description: S3 path or URL to the exported video file. Populated when `errorCode == 1005`.
          examples:
          - https://media-export-bucket.s3.us-east-1.amazonaws.com/export/clip_20231114_30s.mp4
        baseVideoPath:
          type: string
          description: Base path for the video (without storage prefix).
        metadataJsonPath:
          type: string
          description: S3 path to the companion metadata JSON (if `withMetadataJson` was `true`).
        baseMetadataJsonPath:
          type: string
          description: Base path for the metadata JSON.
        fileSize:
          type: integer
          format: int64
          description: Output file size in bytes. Populated when `errorCode == 1005`.
          examples:
          - 52428800
        videoDuration:
          type: integer
          format: int64
          description: Actual duration of the exported clip in milliseconds.
          examples:
          - 30000
        thumbnailInfo:
          $ref: '#/components/schemas/ThumbnailBaseInfo'
        videoInfo:
          $ref: '#/components/schemas/VideoBaseInfo'
      x-apifox-orders:
      - errorCode
      - errorMsg
      - isDryrun
      - timeWait
      - videoPath
      - baseVideoPath
      - metadataJsonPath
      - baseMetadataJsonPath
      - fileSize
      - videoDuration
      - thumbnailInfo
      - videoInfo
      x-apifox-ignore-properties: []
      x-apifox-folder: ''
    VideoBaseInfo:
      type: object
      properties:
        url:
          type: string
          description: URL of the output video file.
        type:
          type: string
          description: Container format (e.g. `ts`, `mp4`).
        bitrate:
          type: string
          description: Video bitrate (e.g. `"5000k"`).
        width:
          type: string
          description: Frame width in pixels.
        height:
          type: string
          description: Frame height in pixels.
        framerate:
          type: string
          description: Frame rate (e.g. `"29.97"`).
        duration:
          type: string
