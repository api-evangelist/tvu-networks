          format: int64
          description: Total clip duration in **milliseconds**.
          examples:
          - 3600000
        maxChunkDuration:
          type: integer
          format: int64
          description: Maximum duration per output chunk in **milliseconds**.
          examples:
          - 600000
        userAccount:
          type: string
          description: Email or identifier of the requesting user.
