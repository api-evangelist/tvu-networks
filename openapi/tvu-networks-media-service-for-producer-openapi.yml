  /media/tvucc-media/other/authInfo:
    post:
      summary: addRtmpOutputAccount
      deprecated: false
      description: "**Request Param：** \n\nrequestParam\n\n| param name     | required | type    | desc\
        \               |\n| :--------- | :--- | :------ | ------------------- |\n| nickName    |  Y \
        \ | String  | nickName       |\n| authType   | Y   | Integer |  default value:1   |\n| rtmpType\
        \ | Y   | Integer  | 0:PUSH 1:PULL   |\n| subType | Y   | String  | default value: RTMP |\n| rtmpUrl\
        \ | F   | String  | when rtmpType is 0 must be set value，The address of rtmp pull can be found\
        \ in the ListOutputAccount API after successful streaming (it is necessary to modify the sendeType\
        \ parameter in the ListOutputAccount API and add an O type)|\n| index   | F   | String | random\
        \ four digit letter, when rtmpType is 1 must be set, for example: abcd  |\n| resolution   | F\
        \   | String  | 1920x1080            |\n| bitrate    | F   | String  | default value: 5.0M   \
        \    |\n| mode   | F   | String  | 0: overlay 1:clean           |\n| audioCode   | F   | String\
        \  | audio code,for example: AAC          |\n| videoCode | F   | String  |video code,for example:\
        \ H264      |\n\n\nrtmp pull request exmple:\n```\n{\n    \"nickName\": \"test-rtmp-pull\",\n\
        \    \"rtmpUrl\": \"\",\n    \"authType\": 1,\n    \"subType\": \"RTMP\",\n    \"index\": \"abcd\"\
        ,\n    \"rtmpType\": 1,\n    \"bitrate\": \"5.0M\",\n    \"resolution\": \"1920x1080\",\n    \"\
        mode\": 0,\n    \"audioCode\": \"AAC\",\n    \"videoCode\": \"H264\"\n}\n```\nrtmp push request\
        \ exmple:\n```\n{\n    \"nickName\": \"test-rtmp-push\",\n    \"rtmpUrl\": \"rtmp://10.12.22.23/live/test\"\
        ,\n    \"authType\": 1,\n    \"subType\": \"RTMP\",\n    \"index\": \"RQ47\",\n    \"rtmpType\"\
        : 0,\n    \"bitrate\": \"5.0M\",\n    \"resolution\": \"1920x1080\",\n    \"mode\": 0,\n    \"\
        audioCode\": \"AAC\",\n    \"videoCode\": \"H264\"\n}\n```\n\n\n\n **Response**\n\n```  \n// Success\n\
        {\n    \"errorCode\": \"0x0\",\n    \"errorInfo\": \"Success\",\n    \"result\": {\n\t  \"mediaId\"\
        :\"431542354fgfdsgfds3454\"\n\t}\n}\n\n```\n\n**Update Rtmp account**\n\n**Request Param：**\n\n\
        requestParam\n\n| param name     | required | type    | desc               |\n| :--------- | :---\
        \ | :------ | ------------------- |\n| id    |  Y  | String  | account id       |\n| nickName\
        \    |  Y  | String  | nickName       |\n| authType   | Y   | Integer |  default value:1   |\n\
        | rtmpType | Y   | Integer  | 0:PUSH 1:PULL  |\n| subType | Y   | String  | default value: RTMP\
        \ |\n| rtmpUrl | F   | String  | when rtmpType is 0 must be set value|\n| index   | F   | String\
        \ | random four digit letter, when rtmpType is 1 must be set, for example: abcd  |\n| resolution\
        \   | F   | String  | 1920x1080            |\n| bitrate    | F   | String  | default value: 5.0M\
        \       |\n| mode   | F   | String  | 0: overlay 1:clean           |\n| audioCode   | F   | String\
        \  | audio code,for example: AAC          |\n| videoCode | F   | String  |video code,for example:\
        \ H264      |\n\n\nrtmp pull request exmple:\n```\n{\n    \"id\":\"431542354fgfdsgfds3454\",\n\
        \    \"nickName\": \"test-rtmp-pull\",\n    \"rtmpUrl\": \"\",\n    \"authType\": 1,\n    \"subType\"\
        : \"RTMP\",\n    \"index\": \"abcd\",\n    \"rtmpType\": 1,\n    \"bitrate\": \"5.0M\",\n    \"\
        resolution\": \"1920x1080\",\n    \"mode\": 0,\n    \"audioCode\": \"AAC\",\n    \"videoCode\"\
        : \"H264\"\n}\n```\nrtmp push request exmple:\n```\n{\n\t\"id\":\"431542354fgfdsgfds3454\",\n\
        \    \"nickName\": \"test-rtmp-push\",\n    \"rtmpUrl\": \"rtmp://10.12.22.23/live/test\",\n \
        \   \"authType\": 1,\n    \"subType\": \"RTMP\",\n    \"index\": \"RQ47\",\n    \"rtmpType\":\
        \ 0,\n    \"bitrate\": \"5.0M\",\n    \"resolution\": \"1920x1080\",\n    \"mode\": 0,\n    \"\
        audioCode\": \"AAC\",\n    \"videoCode\": \"H264\"\n}\n```\n\n\n\n **Response**\n\n```  \n// Success\n\
        {\n    \"errorCode\": \"0x0\",\n    \"errorInfo\": \"Success\",\n    \"result\": null\n}\n\n```\n"
      tags:
      - Media Service For Producer/tvucc-media
      parameters:
      - name: SID
        in: header
        description: ''
        required: true
        example: F104519230124A5D8079CAA89449FF2C
        schema:
          type: string
      - name: Cookie
        in: header
        description: ''
        required: true
        example: mediasearch10=10mstfri
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
              x-apifox-orders: []
            example:
              nickName: test-rtmp-push
              rtmpUrl: rtmp://10.12.22.23/live/test
              authType: 1
              subType: RTMP
              index: RQ47
              rtmpType: 0
              bitrate: 5.0M
              resolution: 1920x1080
              mode: 0
              audioCode: AAC
              videoCode: H264
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apifox-orders: []
              example:
                errorCode: '0x0'
                errorInfo: Success
                result:
                  mediaId: 431542354fgfdsgfds3454
          headers: {}
          x-apifox-name: Untitled Response
      security: []
      x-apifox-folder: Media Service For Producer/tvucc-media
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-250778593-run
      operationId: addRtmpOutputAccount_250778593
      x-source-doc: https://docs.tvunetworks.cn/api-250778593.md
  /media/tvucc-media/outputSetting/add:
    post:
      summary: addOutPutAccount
      deprecated: false
      description: "**Request URL**\n\n- `{{domain}}`<strong>`/media/tvucc-media/outputSetting/add`</strong>\n\
        \n**Request Mode**\n\n- POST\n\n**Request Headers**\n\n|key|value|\n|:----|:---|\n|Authorization|[F104519230124A5D8079CAA89449FF2C]|\n\
        |Cookie|[SID=F104519230124A5D8079CAA89449FF2C]|\n|Content-Type|[application/json;charset=UTF-8]|\n\
        **Parameter(body)**\n\n|name|required|type|explain|\n|:----|:---|:----|:---|\n|nickName|Y|String|output\
        \ account|\n|type|Y|String|output account type: HLS,SRT,RTP-FEC(The interface passes parameters\
        \ as PROMPEG)|\n|resolution|Y|String|output resolution|\n|bitrate|Y|String|output bitrate|\n|serverName|Y|String|The\
        \ producer user passes the parameter value as pp|\n|targetId|Y|String|business id,Producer users\
        \ suggest filling in the program ID|\n|externalParameters|Y|String|external param Different types\
        \ have different extension parameters, which will be explained below|\n|shareFlag|F|Integer|Share\
        \ Across TVU Services 1：true,0:false,When set to 1, queries can be performed without binding to\
        \ targetId|\n|customTag|F|String|Custom label: first used for commentator hiding function (passing\
        \ commentator default)|\n\n**HLS externalParameters param exmaple**\n\n json string:\n\n\"{\\\"\
        duration\\\":6,\\\"sliceCount\\\":10,\\\"index\\\":\\\"1\\\",\\\"mode\\\":0}\"\n\n**duration**:\
        \ Chunk Size\n**sliceCount**: Slice Count\n**index**: index name\n**mode**: 1:overlay,0:clean\n\
        \n**SRT externalParameters param exmaple**\n json string\n{\"ip\":\"10.12.22.213\",\"port\":\"\
        5211\",\"latency\":2000,\"packetSize\":1316,\"advParams\":\"passphrase=xxxx\",\"audioLang\":\"\
        eng\",\"streamType\":\"caller\",\"mode\":0,\"advancedCbr\":true}\n\n**ip**: output address\n**port**:\
        \ ouput port\n**proMPEGColumns**:FEC columns\n**proMPEGRows**:FEC rows\n**audioLang**: output\
        \ language \n**mode**: 1:overlay,0:clean\n\n**RTP-FEC externalParameters param exmaple**\njson\
        \ string\n\"{\"ip\":\"10.12.22.10\",\"port\":\"8080\",\"proMPEGColumns\":12,\"proMPEGRows\":8,\"\
        audioLang\":\"eng\",\"mode\":0}\"\n\n\n\n**ip**: output address,listener mode Can be left blank\n\
        **port**: ouput port\n**latency**:Latency, in milliseconds\n**packetSize**:Packet size，in bytes\n\
        **audioLang**: output language \n**streamType**: option values [listener|caller|rendezvous]\n\
        **mode**: 1:overlay,0:clean\n---\n\n\n\n# Request Example\n\n**Request Example(body)**\n```json\n\
        {\n\t\"nickName\": \"HLS_20230410\",\n\t\"type\": \"HLS\",\n\t\"serverName\": \"pp\",\n\t\"targetId\"\
        : 52846403399680,\n\t\"shareFlag\": 0,\n\t\"externalParameters\": \"{\\\"duration\\\":6,\\\"sliceCount\\\
        \":10,\\\"index\\\":\\\"1\\\",\\\"mode\\\":0}\",\n\t\"resolution\": \"1920x1080\",\n\t\"bitrate\"\
        : 8192,\n\t\"gopSizeMs\": 2000\n}\n```\n\n\n\n\n---\n\n\n\n# Response Example\n\n**Return Example**\n\
        \n- \n```json\n{\n  \"errorCode\" : \"0x0\",\n  \"errorInfo\" : \"Success\",\n  \"result\" : \"\
        65278fb84a104c28af8cf2816e29b652\"\n}\n```\n**Return Example Description**\n\n|name|type|explain|\n\
        |:----|:---|:---|\n|result|String|Return data this is output account id|\n|errorCode|String|Return\
        \ error code description，0x0:success|\n|errorInfo|String|Return error description|\n"
      tags:
      - Media Service For Producer/tvucc-media/output Setting
      parameters:
      - name: SID
        in: header
        description: ''
        required: true
        example: SID=9A7E0459687F472A82096FAAE5BAEC66
        schema:
          type: string
      - name: Cookie
        in: header
        description: ''
        required: true
        example: mediasearch10=10mstfri
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
              x-apifox-orders: []
            example:
              nickName: HLS_20230410
              type: HLS
              serverName: pp
              targetId: 52846403399680
              shareFlag: 0
              externalParameters: '{"duration":6,"sliceCount":10,"index":"1","mode":0}'
              resolution: 1920x1080
              bitrate: 8192
              gopSizeMs: 2000
      responses:
        '200':
          description: ''
