  /media/tvucc-media/outputSetting/update:
    post:
      summary: updateOutputAccount
      deprecated: false
      description: "# Description\n\n**Brief**\n\n- update account\n\n**Request URL**\n\n- `{{domain}}`<strong>`/media/tvucc-media/outputSetting/update`</strong>\n\
        \n**Request Mode**\n\n- POST\n\n**Request Headers**\n\n|key|value|\n|:----|:---|\n|Authorization|[F104519230124A5D8079CAA89449FF2C]|\n\
        |Cookie|[SID=F104519230124A5D8079CAA89449FF2C]|\n|Content-Type|[application/json;charset=UTF-8]|\n\
        \n**Parameter(body)**\n|name|required|type|explain|\n|:----|:---|:----|:---|\n|id|Y|String|output\
        \ account id|\n|nickName|Y|String|output account|\n|type|Y|String|output account type: HLS,SRT,RTP-FEC(The\
        \ interface passes parameters as PROMPEG)|\n|resolution|Y|String|output resolution|\n|bitrate|Y|String|output\
        \ bitrate|\n|serverName|Y|String|The producer user passes the parameter value as pp|\n|targetId|Y|String|business\
        \ id,Producer users suggest filling in the program ID|\n|externalParameters|Y|String|external\
        \ param Different types have different extension parameters, which will be explained below|\n\
        |shareFlag|F|Integer|Share Across TVU Services 1：true,0:false,When set to 1, queries can be performed\
        \ without binding to targetId|\n|customTag|F|String|Custom label: first used for commentator hiding\
        \ function (passing commentator default)|\n\n**HLS externalParameters param exmaple**\n\n json\
        \ string:\n\n\"{\\\"duration\\\":6,\\\"sliceCount\\\":10,\\\"index\\\":\\\"1\\\",\\\"mode\\\"\
        :0}\"\n\n**duration**: Chunk Size\n**sliceCount**: Slice Count\n**index**: index name\n**mode**:\
        \ 1:overlay,0:clean\n\n**SRT externalParameters param exmaple**\n json string\n{\"ip\":\"10.12.22.213\"\
        ,\"port\":\"5211\",\"latency\":2000,\"packetSize\":1316,\"advParams\":\"passphrase=xxxx\",\"audioLang\"\
        :\"eng\",\"streamType\":\"caller\",\"mode\":0,\"advancedCbr\":true}\n\n**ip**: output address\n\
        **port**: ouput port\n**proMPEGColumns**:FEC columns\n**proMPEGRows**:FEC rows\n**audioLang**:\
        \ output language \n**mode**: 1:overlay,0:clean\n\n**RTP-FEC externalParameters param exmaple**\n\
        json string\n\"{\"ip\":\"10.12.22.10\",\"port\":\"8080\",\"proMPEGColumns\":12,\"proMPEGRows\"\
        :8,\"audioLang\":\"eng\",\"mode\":0}\"\n\n**ip**: output address,listener mode Can be left blank\n\
        **port**: ouput port\n**latency**:Latency, in milliseconds\n**packetSize**:Packet size，in bytes\n\
        **audioLang**: output language \n**streamType**: option values [listener|caller|rendezvous]\n\
        **mode**: 1:overlay,0:clean\n\n---\n\n\n\n# Request Example\n\n**Request Example(body)**\n```json\n\
        {\n    \"id\" : \"511d42826ef04b708695872290185bd9\",\n\t\"nickName\": \"HLS_20230410\",\n\t\"\
        type\": \"HLS\",\n\t\"serverName\": \"pp\",\n\t\"targetId\": 52846403399680,\n\t\"shareFlag\"\
        : 0,\n\t\"externalParameters\": \"{\\\"duration\\\":6,\\\"sliceCount\\\":10,\\\"index\\\":\\\"\
        1\\\",\\\"mode\\\":0}\",\n\t\"resolution\": \"1920x1080\",\n\t\"bitrate\": 8192,\n\t\"gopSizeMs\"\
        : 2000\n}\n```\n\n\n\n\n---\n\n\n\n# Response Example\n\n**Return Example**\n\n```json\n{\n  \"\
        errorCode\" : \"0x0\",\n  \"errorInfo\" : \"Success\",\n  \"result\" : \"511d42826ef04b708695872290185bd9\"\
        \n}\n```\n**Return Example Description**\n\n|name|type|explain|\n|:----|:---|\n|result|String|Return\
        \ data|\n|errorCode|String|Return error code description，0x0:success|\n|errorInfo|String|Return\
        \ error description|\n"
      tags:
      - Media Service For Producer/tvucc-media/output Setting
      parameters:
      - name: SID
        in: header
        description: ''
        required: true
        example: D9B77CDEEA384660AE00A523E057432C
        schema:
          type: string
      - name: Cookie
        in: header
        description: ''
        required: true
        example: mediasearch10=10mstfri
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
              x-apifox-orders: []
            example:
              id: 511d42826ef04b708695872290185bd9
              nickName: HLS_20230410
              type: HLS
              serverName: pp
              targetId: 52846403399680
              shareFlag: 0
              externalParameters: '{"duration":6,"sliceCount":10,"index":"1","mode":0}'
              resolution: 1920x1080
              bitrate: 8192
              gopSizeMs: 2000
      responses:
