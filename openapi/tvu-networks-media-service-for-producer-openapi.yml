          content:
            '*/*':
              schema:
                type: object
                properties: {}
                x-apifox-orders: []
              example: "{\n    \"errorCode\": \"0x0\",\n    \"errorInfo\": \"Success\",\n    \"result\"\
                : {\n        \"total\": 3,\n        \"list\": [\n            {\n                \"id\"\
                : \"6ad83f504f594b1ca2288b2adb0efdcb\",\n                \"nickName\": \"HLS531\",\n \
                \               \"createTime\": 1653990294613,\n                \"updateTime\": 1653990294613,\n\
                \                \"externalParameters\": \"{\\\"duration\\\":3,\\\"sliceCount\\\":10,\\\
                \"index\\\":\\\"q9AO\\\"}\",\n                \"bitrate\": \"8192\",\n               \
                \ \"resolution\": \"1280x720\",\n                \"targetId\": \"\",\n               \
                \ \"type\": \"HLS\",\n                \"userId\": \"8a08ca655f9ec2d901604f495fed01dd\"\
                ,\n                \"deleteFlag\": 0,\n                \"importType\": \"output\",\n \
                \               \"authType\": \"0\",\n                \"isCrop\": null,\n            \
                \    \"pushTime\": null,\n                \"subType\": null,\n                \"living\"\
                : false,\n                \"rid\": null,\n                \"autoResolution\": 0,\n   \
                \             \"rtmpUrl\": null,\n                \"audioTrackMap\": null,\n         \
                \       \"rtmpType\": null\n            },\n            {\n                \"id\": \"\
                3366c632013642ab82e1e8b87d6190d7\",\n                \"nickName\": \"SRT-share\",\n  \
                \              \"createTime\": 1653989405919,\n                \"updateTime\": 1653989405919,\n\
                \                \"externalParameters\": \"{\\\"ip\\\":\\\"\\\",\\\"port\\\":\\\"8288\\\
                \",\\\"latency\\\":1000,\\\"packetSize\\\":1316,\\\"advParams\\\":\\\"\\\",\\\"audioLang\\\
                \":\\\"eng\\\",\\\"streamType\\\":\\\"listener\\\"}\",\n                \"bitrate\": \"\
                8192\",\n                \"resolution\": \"1280x720\",\n                \"targetId\":\
