  /media/tvucc-media/media/program/stream/list:
    post:
      summary: ListOutputAccount
      deprecated: false
      description: "**request URL：** \n\n-  POST ` {{domain}}/media/tvucc-media/media/program/stream/list`\n\
        \n**Request Headers**\n\n|key|value|\n|:----|:---|\n|Authorization|[F104519230124A5D8079CAA89449FF2C]|\n\
        |Cookie|[SID=F104519230124A5D8079CAA89449FF2C]|\n|Content-Type|[application/json;charset=UTF-8]|\n\
        \n**request param：** \n\n| param   | required | type    | explain                            \
        \                   |\n| -------- | ---- | ------- | --------------------------------------------------\
        \ |\n| targetId     | F   | String  |business id,can be set producer program id |\n| secondType\
        \     | F   | String  | output type, can be set HLS,SRT,PROMPEG(RTP-FEC) |\n| importType     |F\
        \    | String  | option valule:  output,socail |\n| nickName | F   | String  | query by nickName\
        \                       |\n| pageNum  | F   | int     | default value: 1                     \
        \          |\n| pageSize | F   | int     | default valule:10               |\n**request example**\n\
        \n```\n{\n    \"secondType\":\"HLS,PROMPEG,SRT\",\n    \"targetId\":\"52846403399680\",\n    \"\
        nickName\":\"\"\n}\n\n```\n**response body：** \n\n| param   | explain                        \
        \                       |\n| -------- | -------------------------------------------------- |\n\
        | id     | output account id|\n| nickName    | output account nickname |\n| createTime    |create\
        \ time in millisecond |\n| updateTime | update time in millisecond                   |\n| externalParameters\
        \  | external param  from add account|\n| bitrate | bitrate          |\n| resolution     |resolution\
        \ |\n| targetId     |producer program id |\n| type    | output type :HLS.... |\n| userId| tvu\
        \ user id                    |\n| deleteFlag  | default 0 |\n| living    | Is streaming in progress\
        \ ：true or false |\n| rtmpUrl   | output address |\n\n\n\n\n **成功返回示例**\n\n```  json\n{\n  \"\
        errorCode\": \"0x0\",\n  \"errorInfo\": \"Success\",\n  \"result\": {\n    \"total\": 3,\n   \
        \ \"list\": [\n      {\n        \"id\": \"6ad83f504f594b1ca2288b2adb0efdcb\",\n        \"nickName\"\
        : \"HLS531\",\n        \"createTime\": 1653990294613,\n        \"updateTime\": 1653990294613,\n\
        \        \"externalParameters\": \"{\\\"duration\\\":3,\\\"sliceCount\\\":10,\\\"index\\\":\\\"\
        q9AO\\\"}\",\n        \"bitrate\": \"8192\",\n        \"resolution\": \"1280x720\",\n        \"\
        targetId\": \"\",\n        \"type\": \"HLS\",\n        \"userId\": \"8a08ca655f9ec2d901604f495fed01dd\"\
        ,\n        \"deleteFlag\": 0,\n        \"importType\": \"output\",\n        \"authType\": \"0\"\
        ,\n        \"isCrop\": null,\n        \"pushTime\": null,\n        \"subType\": null,\n      \
        \  \"living\": false,\n        \"rid\": null,\n        \"autoResolution\": 0,\n        \"rtmpUrl\"\
        : null,\n        \"audioTrackMap\": null,\n        \"rtmpType\": null\n      },\n      {\n   \
        \     \"id\": \"3366c632013642ab82e1e8b87d6190d7\",\n        \"nickName\": \"SRT-share\",\n  \
        \      \"createTime\": 1653989405919,\n        \"updateTime\": 1653989405919,\n        \"externalParameters\"\
        : \"{\\\"ip\\\":\\\"\\\",\\\"port\\\":\\\"8288\\\",\\\"latency\\\":1000,\\\"packetSize\\\":1316,\\\
        \"advParams\\\":\\\"\\\",\\\"audioLang\\\":\\\"eng\\\",\\\"streamType\\\":\\\"listener\\\"}\"\
        ,\n        \"bitrate\": \"8192\",\n        \"resolution\": \"1280x720\",\n        \"targetId\"\
        : \"\",\n        \"type\": \"SRT\",\n        \"userId\": \"8a08ca655f9ec2d901604f495fed01dd\"\
        ,\n        \"deleteFlag\": 0,\n        \"importType\": \"output\",\n        \"authType\": \"0\"\
        ,\n        \"isCrop\": null,\n        \"pushTime\": null,\n        \"subType\": null,\n      \
        \  \"living\": false,\n        \"rid\": null,\n        \"autoResolution\": 0,\n        \"rtmpUrl\"\
        : null,\n        \"audioTrackMap\": null,\n        \"rtmpType\": null\n      },\n      {\n   \
        \     \"id\": \"a8337e91c68947fe9cdec191093e0072\",\n        \"nickName\": \"HLS-share\",\n  \
        \      \"createTime\": 1653989208668,\n        \"updateTime\": 1653989208668,\n        \"externalParameters\"\
        : \"{\\\"duration\\\":3,\\\"sliceCount\\\":10,\\\"index\\\":\\\"DYLg\\\"}\",\n        \"bitrate\"\
        : \"8192\",\n        \"resolution\": \"1280x720\",\n        \"targetId\": \"\",\n        \"type\"\
        : \"HLS\",\n        \"userId\": \"8a08ca655f9ec2d901604f495fed01dd\",\n        \"deleteFlag\"\
        : 0,\n        \"importType\": \"output\",\n        \"authType\": \"0\",\n        \"isCrop\": null,\n\
        \        \"pushTime\": null,\n        \"subType\": null,\n        \"living\": false,\n       \
        \ \"rid\": null,\n        \"autoResolution\": 0,\n        \"rtmpUrl\": null,\n        \"audioTrackMap\"\
        : null,\n        \"rtmpType\": null\n      }\n    ],\n    \"pageNum\": 1,\n    \"pageSize\": 10,\n\
        \    \"size\": 3,\n    \"startRow\": 0,\n    \"endRow\": 2,\n    \"pages\": 1,\n    \"prePage\"\
        : 0,\n    \"nextPage\": 0,\n    \"isFirstPage\": true,\n    \"isLastPage\": true,\n    \"hasPreviousPage\"\
        : false,\n    \"hasNextPage\": false,\n    \"navigatePages\": 8,\n    \"navigatepageNums\": [\n\
        \      1\n    ],\n    \"navigateFirstPage\": 1,\n    \"navigateLastPage\": 1,\n    \"firstPage\"\
        : 1,\n    \"lastPage\": 1\n  }\n}\n```"
      tags:
      - Media Service For Producer/tvucc-media
