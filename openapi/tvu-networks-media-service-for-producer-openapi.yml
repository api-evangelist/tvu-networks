          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
                x-apifox-orders: []
              example: "{\n    \"errorCode\": \"0x0\",\n    \"errorInfo\": \"Success\",\n    \"result\"\
                : \"511d42826ef04b708695872290185bd9\"\n}"
          headers: {}
          x-apifox-name: Untitled Response
      security: []
      x-apifox-folder: Media Service For Producer/tvucc-media/output Setting
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-250778594-run
      operationId: updateOutputAccount_250778594
      x-source-doc: https://docs.tvunetworks.cn/api-250778594.md
