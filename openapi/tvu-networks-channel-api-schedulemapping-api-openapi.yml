                fixedStartMode: false
                followOnStartMode: false
                fixedEndMode: true
                holdEndMode: false
                liveSource: false
                clipSource: true
                mediaFileName: ExternalSource3
                liveFileName: ExternalSource3
                scheduleFileEventSegmentList:
                - segmentId: 6
                  title: SCTE PGM Start Show 1
                  timingIn: 0
                  timingOut: 0
                  sourceType: 0
                  fileName: SCTE PGM Start
                  segmentOrder: 2
