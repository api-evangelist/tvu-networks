openapi: 3.2.0
info:
  title: TVU Networks — Uncategorized Route Object API
  description: Uncategorized operations of the TVU Networks public HTTP API, assembled verbatim from the per-endpoint OpenAPI 3.0.1 exports TVU publishes on its own Apifox documentation site (https://docs.tvunetworks.cn/). Each operation body is the provider's own export; only grouping, servers[] and operationId backfill were added by API Evangelist.
  version: 1.0.0
  contact:
    name: TVU Networks
    url: https://www.tvunetworks.com/tvu-developer/
servers:
- url: https://api.tvunetworks.com
  description: Prod Env default server
tags:
- name: Route Object
paths:
  /route-object/object-service/api/v1/object:
    post:
      summary: Create a new object
      deprecated: false
      description: 'Creates an object in objectd with full field support including features, geo info,

        admin/owner info, tags, and optional tangible binding.


        Example request:


        POST /api/v1/object

        {

        "objectName": "Studio Camera 1",

        "objectType": 1,

        "tangibleId": "tgb-001",

        "tangibleType": "SDI",

        "tangibleName": "SDI Input 1",

        "isAsyn": false

        }'
      tags:
      - Route Object
      parameters:
      - name: SID
        in: header
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      requestBody:
        content:
          application/json:
            schema:
              description: unified object creation parameter with all supported fields
              type: object
              properties:
                objectId:
                  type: integer
                  description: Unique object ID (Long). Null when creating a new object; populated on response.
                  format: int64
                objectName:
                  type: string
                  description: Human-readable name of the object. Required for creation.
                objectType:
                  type: integer
                  description: Integer type code of the object (e.g., 1 = source, 2 = project). Required for creation.
                tangibleId:
                  type: string
                  description: ID of the tangible (physical device/source) to bind to this object.
                tangibleType:
                  type: string
                  description: Type of the tangible (e.g., SDI, PACK, EXT, ANYWHERE).
                tangibleName:
                  type: string
                  description: Human-readable name of the tangible device.
                distinction:
                  type: string
                  description: Distinction label used to differentiate multiple tangibles on the same object.
                admin:
                  $ref: '#/components/schemas/AdminInfo'
                  description: Admin user info (userId and email of the object administrator).
                owner:
                  $ref: '#/components/schemas/OwnerInfo'
                  description: Owner user info (userId and email of the object owner).
                tags:
                  type: array
                  items:
                    type: string
                  description: List of tag strings to apply to the object (e.g., "broadcast", "live").
                features:
                  type: array
                  items:
                    $ref: '#/components/schemas/FeatureInfo'
                    description: ''
                  description: List of feature flags to enable on the object (e.g., recording, publicSlug).
                extraInfo:
                  type: string
                  description: Extra JSON metadata string for additional tangible-specific information.
                origin:
                  type: string
                  description: Origin identifier indicating the service or system creating the object.
                geoInfo:
                  type: array
                  items:
                    $ref: '#/components/schemas/GeoInfo'
                    description: ''
                  description: List of geographic coordinates associated with the object.
                location:
                  type: array
                  items:
                    type: string
                  description: List of location name strings (e.g., city, country).
                dmaEmbargo:
                  type: boolean
                  description: Whether the object has a DMA embargo restriction applied.
                description:
                  type: string
                  description: Free-text description of the object.
                url:
                  type: string
                  description: Special SDI URL for MediaHub objects requiring URL-based tangible resolution.
                attributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateObjectAttr'
                    description: com.tvunetworks.model.objectd.CreateObjectAttr
                  description: List of custom attributes to attach to the object on creation.
                priority:
                  type: integer
                  description: Priority for the tangible binding when an object is bound to multiple tangibles. 0 = highest priority.
                isAsyn:
                  type: boolean
                  description: 'If{@code true}, the object is created asynchronously. Default: false (synchronous).'
              x-apifox-orders:
              - objectId
              - objectName
              - objectType
              - tangibleId
              - tangibleType
              - tangibleName
              - distinction
              - admin
              - owner
              - tags
              - features
              - extraInfo
              - origin
              - geoInfo
              - location
              - dmaEmbargo
              - description
              - url
              - attributes
              - priority
              - isAsyn
              x-apifox-ignore-properties: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                  errorInfo:
                    type: string
                  result:
                    type: string
                    description: created object ID
                required:
                - errorCode
                - errorInfo
                - result
                description: '[ProcessResult] wrapping the created object ID as a string'
                x-apifox-orders:
                - errorCode
                - errorInfo
                - result
                x-apifox-ignore-properties: []
              example:
                errorCode: '0x0'
                errorInfo: success
                result: string
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-473290259-run
      operationId: Create_a_new_object_473290259
      x-source-doc: https://docs.tvunetworks.cn/api-473290259.md
    put:
      summary: Update an existing object
      deprecated: false
      description: 'Updates object metadata in objectd. Only fields provided in the request body are updated.


        Example request:


        PUT /api/v1/object

        {

        "objectId": "123456",

        "objectName": "Updated Camera Name",

        "description": "Primary broadcast camera",

        "tags": ["live", "broadcast"]

        }'
      tags:
      - Route Object
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              description: update parameter containing the objectId (required) and fields to update
              type: object
              properties:
                objectId:
                  type: string
                  description: Unique ID of the object to update. Required.
                objectName:
                  type: string
                  description: New name for the object. Leave null to keep the existing name.
                nestedObjects:
                  type: array
                  items:
                    $ref: '#/components/schemas/NestedObjects'
                    description: ''
                  description: Updated list of nested child objects. Replaces the existing nested object list if provided.
                description:
                  type: string
                  description: Updated free-text description. Leave null to keep the existing description.
                admin:
                  $ref: '#/components/schemas/AdminInfo'
                  description: Updated admin user info. Leave null to keep the existing admin.
                owner:
                  $ref: '#/components/schemas/OwnerInfo'
                  description: Updated owner user info. Leave null to keep the existing owner.
                features:
                  type: array
                  items:
                    $ref: '#/components/schemas/FeatureInfo'
                    description: ''
                  description: Updated list of feature flags. Replaces the existing features list if provided.
                dmaEmbargo:
                  type: boolean
                  description: Updated DMA embargo flag. Leave null to keep the existing value.
                geoInfo:
                  type: array
                  items:
                    $ref: '#/components/schemas/GeoInfo'
                    description: ''
                  description: Updated list of geographic coordinates. Leave null to keep existing geo info.
                location:
                  type: array
                  items:
                    type: string
                  description: Updated list of location name strings. Leave null to keep existing locations.
                origin:
                  type: string
                  description: Updated origin identifier. Leave null to keep the existing value.
                tags:
                  type: array
                  items:
                    type: string
                  description: Updated list of tag strings. Replaces the existing tags list if provided.
              x-apifox-orders:
              - objectId
              - objectName
              - nestedObjects
              - description
              - admin
              - owner
              - features
              - dmaEmbargo
              - geoInfo
              - location
              - origin
              - tags
              x-apifox-ignore-properties: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphqlResult'
                description: '[Standard result wrapper for objectd GraphQL operations.

                  A successful response has{@code errorCode = "0x0"}.] with errorCode {@code 0x0} on success, or error details on failure'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-473290260-run
      operationId: Update_an_existing_object_473290260
      x-source-doc: https://docs.tvunetworks.cn/api-473290260.md
    delete:
      summary: Delete an object (requires authentication)
      deprecated: false
      description: 'Deletes the specified object using the given deleteType. Requires user authentication via

        {@code @Authorization}; the userId is populated automatically from the auth context.


        Example request:


        DELETE /api/v1/object?serviceName=media-service

        {

        "objectId": "123456",

        "deleteType": 2,

        "forceDelete": false

        }'
      tags:
      - Route Object
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: object01
        in: cookie
        description: ''
        required: false
        example: 01daily1
        schema:
          type: string
          default: 01daily1
      - name: serviceName
        in: query
        description: name of the calling service for audit logging (required)
        required: true
        schema:
          type: string
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              description: "delete parameter containing required objectId, deleteType (1=ready-to-delete, 2=delete, 3=to-app-delete), and forceDelete flag;\n                      userId is populated from the auth context"
              type: object
              properties:
                userId:
                  type: string
                  description: ID of the user requesting the delete. Populated from auth context when using authenticated endpoints.
                objectId:
                  type: string
                  description: ID of the object to delete. Required.
                deleteType:
                  type: integer
                  description: "Delete operation type.\n<ul>\n  <li>1 = ready-to-delete (move to recycling bin)</li>\n  <li>2 = hard delete</li>\n  <li>3 = to-app-delete (notify app service before deletion)</li>\n</ul>"
                forceDelete:
                  type: boolean
                  description: 'If{@code true}, the object is deleted even if it is currently locked. Default: false.'
              required:
              - objectId
              x-apifox-orders:
              - userId
              - objectId
              - deleteType
              - forceDelete
              x-apifox-ignore-properties: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphqlResult'
                description: '[Standard result wrapper for objectd GraphQL operations.

                  A successful response has{@code errorCode = "0x0"}.] with errorCode {@code 0x0} on success, or error details on failure'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-473290261-run
      operationId: Delete_an_object_requires_authentication_473290261
      x-source-doc: https://docs.tvunetworks.cn/api-473290261.md
  /route-object/object-service/api/v1/object/bytangible/{tangibleId}:
    get:
      summary: Query all objects bound to a given tangible ID
      deprecated: false
      description: 'Returns full object details for all objects associated with the specified tangible.


        Example request:


        GET /api/v1/object/bytangible/tgb-001'
      tags:
      - Route Object
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: tangibleId
        in: path
        description: the tangible ID to look up (path variable)
        required: true
        example: ''
        schema:
          type: string
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectDetailsInfo'
                  description: Detailed information for an object returned by queries.
                description: list of [Detailed information for an object returned by queries.] with full object details for each bound object
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-473290263-run
      operationId: Query_all_objects_bound_to_a_given_tangible_ID_473290263
      x-source-doc: https://docs.tvunetworks.cn/api-473290263.md
  /route-object/object-service/api/v1/object/checkfeature:
    post:
      summary: Check whether a specific feature is enabled for a set of objects
      deprecated: false
      description: 'Returns a map of objectId to boolean indicating if the named feature is enabled for each object.


        Example request:


        POST /api/v1/object/checkfeature

        {

        "userId": "user-abc",

        "objectIds": ["123456", "789012"],

        "featureName": "recording"

        }'
      tags:
      - Route Object
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: object01
        in: cookie
        description: ''
        required: false
        example: 01daily1
        schema:
          type: string
          default: 01daily1
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckObjectFeature'
              description: parameter containing userId, the list of objectIds, and the featureName to check
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResultMapBoolean'
                description: '[ProcessResult] wrapping a {@code Map<String, Boolean>} where key is objectId and value indicates whether the feature is enabled'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-473290264-run
      operationId: Check_whether_a_specific_feature_is_enabled_for_a_set_of_objects_473290264
      x-source-doc: https://docs.tvunetworks.cn/api-473290264.md
  /route-object/object-service/api/v1/object/checkowneradmin:
