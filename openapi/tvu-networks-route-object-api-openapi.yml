        Example request:


        POST /api/v1/object/info/ids

        ["123456", "789012", "345678"]'
      tags:
      - Route Object
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: SID
