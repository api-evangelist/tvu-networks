          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResultBoolean'
                description: '[ProcessResult] wrapping a boolean: {@code true} if the user is an admin/owner, {@code false} otherwise'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-473290265-run
      operationId: Check_whether_the_specified_user_is_an_admin_or_owner_of_the_given_object_473290265
      x-source-doc: https://docs.tvunetworks.cn/api-473290265.md
  /route-object/object-service/api/v1/object/copy:
    post:
      summary: Copy an object and bind the copy to a new tangible
      deprecated: false
      description: 'Creates a copy of the specified object and binds the new copy to the given tangibleId.

        The copied object inherits all metadata from the source object.


        Example request:


        POST /api/v1/object/copy

        {

        "objectId": "123456",

        "tangibleId": "tgb-new-001",

        "userId": "user-abc"

        }'
      tags:
      - Route Object
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: object01
        in: cookie
        description: ''
        required: false
        example: 01daily1
        schema:
          type: string
          default: 01daily1
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyObjectParam'
              description: copy parameter containing the required source objectId, required target tangibleId, and required userId
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResult'
                description: '[ProcessResult] wrapping the newly created object ID'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-473290268-run
      operationId: Copy_an_object_and_bind_the_copy_to_a_new_tangible_473290268
      x-source-doc: https://docs.tvunetworks.cn/api-473290268.md
  /route-object/object-service/api/v1/object/hold:
    post:
      summary: Place a hold on an object to reserve it for exclusive use by an application
      deprecated: false
      description: 'Locks the object so that it cannot be used by other applications until explicitly released.

        An optional callback URL is invoked when the hold state changes.


        Example request:


        POST /api/v1/object/hold

        {

        "appName": "media-encoder",

        "objectId": "123456",

        "user": "user-abc",

        "callbackUrl": "https://example.com/callback",

        "tangibleId": "tgb-001",

        "features": ["recording"]

        }'
      tags:
      - Route Object
      parameters:
      - name: SID
        in: cookie
        description: ''
        required: false
        example: '{{SID}}'
        schema:
          type: string
          default: '{{SID}}'
      - name: object01
        in: cookie
        description: ''
        required: false
        example: 01daily1
        schema:
          type: string
          default: 01daily1
      - name: SID
        in: header
        description: ''
        example: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
        schema:
          type: string
          default: 92575d36dcb631ac94745e6b157de17a5a13d65b31e44869f06854ab928dd80235d4daae8696b4a92a7be5f802c45a219648701fc9ca59f44e9c0f022d5d38a7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldObjectParam'
              description: "hold parameter containing required appName, required objectId, required user (userId),\n                        and optional callbackUrl, requestHeader, description, tangibleId, and features list"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphqlResult'
                description: '[Standard result wrapper for objectd GraphQL operations.

                  A successful response has{@code errorCode = "0x0"}.] with errorCode {@code 0x0} on success, or error details on failure'
          headers: {}
          x-apifox-name: ''
      security: []
      x-apifox-folder: ''
      x-apifox-status: released
      x-run-in-apifox: https://app.apifox.com/web/project/4126232/apis/api-473290269-run
      operationId: Place_a_hold_on_an_object_to_reserve_it_for_exclusive_use_by_an_application_473290269
      x-source-doc: https://docs.tvunetworks.cn/api-473290269.md
  /route-object/object-service/api/v1/object/info/ids:
