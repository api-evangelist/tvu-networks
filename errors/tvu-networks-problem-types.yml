transport_note: >-
  TVU signals most application failures inside a HTTP 200 body via errorCode, not via the HTTP
  status. Of the 352 exported operations, all 352 declare a 200; only 63 declare a 400, 40 a 401,
  39 a 405, 9 a 500 and 1 a 403. There is no 429 anywhere. An agent that branches on status alone
  will treat a failed export, a missing source file or an exhausted quota as a success.
