canonical_workflow:
  name: MediaHub complete workflow
  source: https://docs.tvunetworks.cn/folder-47022365
  steps:
  - 'Create an EncodingProfile (POST /urcaller/api/v2/encodingProfile) and keep its id; /urcaller/api/v2/encodingProfile/dict lists the allowed values for every attribute.'
  - 'Create an Output (POST /urcaller/api/v2/output). If MediaHub runs as a listener the url may be omitted and the API returns one.'
  - 'Pair profiles to the output (POST /urcaller/api/v2/output/encodingProfile/pair) producing outputEncodingProfilePairIds — the "destinations" of the UI.'
  - 'Create a Project (POST /mediahub/api/v2/project) pairing one or more pairIds into it.'
  - 'Create a SourceObject (POST /mediahub/api/v2/sourceObject).'
  - 'Initiate LIVE (POST /mediahub/api/v2/route/connect); stop with /mediahub/api/v2/route/disconnect.'
