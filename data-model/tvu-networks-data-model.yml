    The tangible/object split is the spine of the whole model: a tangible is the thing, an object
    is the identity the platform routes and permissions against, and bind/unlink moves one onto
    the other. Numeric IDs are 19-digit opaque strings; tangible IDs are 16- or 32-character hex.
