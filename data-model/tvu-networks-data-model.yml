    name: tangible
    description: 'Addresses a physical or logical device facet — resource_type is one of box/shm/grid/pack/rx/rps/relay/anywhere; sub_type is one of sdi/net/grid/slot.'
    example: res.tvu.ai/t/rx/a6ad44a438873fd7/sdi/2
